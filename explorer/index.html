  // The legend names every band, with its size now; hovering one picks out its band, and clicking one hides it.
  // Hidden ones stay in it, greyed out, in their place by size, and clicking one shows it again, which may move
  // the smallest band shown back into Others.
  const showItem = item => setHidden(new Set([...hidden].filter(title => title !== item.title)));
  const entries = [
    ...series.map((s, i) => ({ s, i, at: s.others ? -1 : items.findIndex(item => item.title === s.title) })),
    ...items.filter(item => hidden.has(item.title)).map(item => ({ s: item, hidden: true, at: items.indexOf(item) })),
  ].sort((a, b) => (b.at === -1) - (a.at === -1) || b.at - a.at);
  const legend = el('div', { class: 'chart-legend' }, entries.map(({ s, i, hidden: isHidden }) => el('button', {
    class: isHidden ? 'hidden-item' : null,
    title: isHidden ? `${s.title}\nHidden · click to show it again`
      : s.others ? 'Click to hide the bigger ones and show these separately' : `${s.title}\nClick to hide it`,
    onmouseenter: isHidden ? null : () => highlight(i), onmouseleave: isHidden ? null : () => highlight(null),
    onclick: isHidden ? () => showItem(s) : s.others ? openOthers : () => hideItem(s),
  }, el('span', { class: 'swatch', style: isHidden ? null : `background:${s.colour}` }), el('span', { class: 'name' }, s.name),
    el('span', { class: 'muted' }, formatSize(s.values[times.length - 1])))));

  // Stacked or overlaid, for every chart on the page
  const setOverlaid = overlaid => {
    chartOverlaid = overlaid;
    try { localStorage.setItem('chartMode', overlaid ? 'overlaid' : 'stacked'); } catch {}
    render();
  };
  const modes = el('span', { class: 'chart-modes', role: 'group', 'aria-label': 'How the chart shows them' },
    [['Stacked', false, 'On top of each other, adding up to the total'], ['Overlaid', true, 'Each from zero, to compare them']].map(([label, overlaid, title]) =>
      el('button', { 'aria-pressed': String(chartOverlaid === overlaid), title, onclick: () => setOverlaid(overlaid) }, label)));

  const panel = el('section', { class: 'panel' },
    el('div', { class: 'chart-head' }, el('h2', {}, heading),
      hidden.size ? el('span', { class: 'legend', title: items.filter(item => hidden.has(item.title)).map(item => item.title).join('\n') },
        `${plural(hidden.size, what[0])} hidden · `,
        el('button', { class: 'linklike', onclick: () => setHidden(new Set()) }, 'Show all')) : null,
      el('span', { class: 'legend', style: 'margin-left:auto' }, `${formatSize(tops[tops.length - 1][times.length - 1])} now`),
      modes),
    chart,
    legend,
    el('p', { class: 'note', style: 'margin:8px 0 0' }, note));
  return panel;
}

// Draw a stacked chart into its box at a width, returning how to pick out a band, for the legend
function drawStackedChart(chart, width, { heading, series, times, tops, max, now, openOthers, overlaid }) {
  // Scales, with a round number of bytes for each gridline
  const height = 240;
  const pad = { left: 64, right: 12, top: 10, bottom: 26 };
  const raw = max / 4;
  const magnitude = 10 ** Math.floor(Math.log10(raw || 1));
  const step = [1, 2, 2.5, 5, 10].map(m => m * magnitude).find(s => s >= raw);
  const top = Math.ceil(max / step) * step || 1;
  const x = t => pad.left + (t - times[0]) / (now - times[0] || 1) * (width - pad.left - pad.right);
  const y = v => height - pad.bottom - v / top * (height - pad.top - pad.bottom);

  // Steps, as a value only changes when a snapshot is taken
  const stepLine = row => row.flatMap((v, j) => (j ? [[x(times[j]), y(row[j - 1])], [x(times[j]), y(v)]] : [[x(times[j]), y(v)]]));
  const bandPath = i => {
    const upper = stepLine(tops[i]);
    const lower = i ? stepLine(tops[i - 1]).reverse() : [[x(now), y(0)], [x(times[0]), y(0)]];
    return `M${[...upper, ...lower].map(([px, py]) => `${px.toFixed(1)},${py.toFixed(1)}`).join('L')}Z`;
  };

  const spanDays = (now - times[0]) / 86400000;
  const dateLabel = t => new Date(t).toLocaleDateString('en-GB', spanDays > 300 ? { month: 'short', year: 'numeric' } : { day: 'numeric', month: 'short' });
  const xTicks = Array.from({ length: 5 }, (_, i) => times[0] + (now - times[0]) * i / 4);
  const yTicks = Array.from({ length: Math.round(top / step) + 1 }, (_, i) => i * step);

  // Stacked, a band each on top of the one below; overlaid, an area each from zero, the biggest drawn first so
  // the smaller ones are in front
  const area = values => `M${[...stepLine(values), [x(now), y(0)], [x(times[0]), y(0)]]
    .map(([px, py]) => `${px.toFixed(1)},${py.toFixed(1)}`).join('L')}Z`;
  const bands = series.map((s, i) => svgEl('path', { class: 'band', d: overlaid ? area(s.values) : bandPath(i), style: `--band:${s.colour}` }));
  const order = overlaid
    ? [...series.keys()].sort((a, b) => Math.max(...series[b].values) - Math.max(...series[a].values))
    : [...series.keys()];
  const bandGroup = svgEl('g', {}, order.map(i => bands[i]));
  // Pick out one, fading the rest; overlaid, it comes to the front so the smaller ones don't hide it
  const highlight = i => {
    bands.forEach((band, k) => band.classList.toggle('faded', i != null && k !== i));
    if (!overlaid) return;
    bandGroup.append(...order.map(k => bands[k]));
    if (i != null) bandGroup.append(bands[i]);
  };
  const crosshair = svgEl('line', { class: 'crosshair', y1: pad.top, y2: height - pad.bottom, visibility: 'hidden' });
  const asOfLine = state.asOf && Date.parse(state.asOf) >= times[0]
    ? svgEl('g', { class: 'as-of-mark' },
      svgEl('line', { x1: x(Date.parse(state.asOf)), x2: x(Date.parse(state.asOf)), y1: pad.top, y2: height - pad.bottom }),
      svgEl('text', { x: x(Date.parse(state.asOf)) + 4, y: pad.top + 10 }, 'Files as of'))
    : null;
  // A tick along the bottom for each snapshot, as that's where the steps come from
  const rug = times.slice(0, -1).map(t => svgEl('line', { class: 'rug', x1: x(t), x2: x(t), y1: height - pad.bottom, y2: height - pad.bottom + 4 }));
  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': heading },
    yTicks.map(v => svgEl('g', { class: 'axis' },
      svgEl('line', { class: 'grid', x1: pad.left, x2: width - pad.right, y1: y(v), y2: y(v) }),
      svgEl('text', { x: pad.left - 8, y: y(v) + 4, 'text-anchor': 'end' }, v ? formatSize(v) : '0'))),
    xTicks.map((t, i) => svgEl('text', { class: 'axis', x: x(t), y: height - 8, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle' }, i === 4 ? 'Now' : dateLabel(t))),
    bandGroup, rug, asOfLine, crosshair);

  // The line follows the pointer, and shows every band's value as of that moment: each holds until the next
  // snapshot. Over a band, it's picked out and the tooltip is just for that one; a click shows its snapshots and
  // a double click opens it, like Contents, and for Others, a click hides the ones shown to show what's in it.
  // Elsewhere, clicking shows files as of then. Within a couple of minutes of now is now.
  const tip = el('div', { class: 'chart-tip', hidden: true });
  const pointed = event => {
    const box = svg.getBoundingClientRect();
    const px = Math.min(Math.max((event.clientX - box.left) / box.width * width, x(times[0])), x(now));
    const py = (event.clientY - box.top) / box.height * height;
    const t = times[0] + (px - pad.left) / (width - pad.left - pad.right) * (now - times[0]);
    // The last snapshot by then, and the band under the pointer then, if any
    let j = 0;
    while (j + 1 < times.length - 1 && times[j + 1] <= t) j++;
    const v = (height - pad.bottom - py) / (height - pad.top - pad.bottom) * top;
    // Stacked, the band the pointer's in; overlaid, the front-most area it's in, the one that's seen there
    const band = v < 0 ? -1 : overlaid
      ? [...order].reverse().find(i => v < series[i].values[j]) ?? -1
      : tops.findIndex(row => v < row[j]);
    return { px, t, j, band, isNow: now - t < 120000 };
  };
  const when = (t, isNow) => el('div', { class: 'when' }, isNow ? 'Now' : formatFull(new Date(t).toISOString()));
  const fromSnapshot = time => el('div', { class: 'hint' },
    time ? `From the snapshot of ${formatFull(new Date(time).toISOString())}` : 'No snapshots yet then');
  const row = (i, j) => el('div', { class: 'row' },
    el('span', { class: 'key', style: `background:${series[i].colour}` }), el('b', {}, formatSize(series[i].values[j])), el('span', {}, series[i].name));
  svg.addEventListener('pointermove', event => {
    const { px, t, j, band, isNow } = pointed(event);
    crosshair.setAttribute('x1', px);
    crosshair.setAttribute('x2', px);
    crosshair.setAttribute('visibility', 'visible');
    highlight(band >= 0 ? band : null);
    tip.replaceChildren(...(band >= 0 ? [
      when(t, isNow), row(band, j),
      el('div', { class: 'path' }, series[band].title),
      fromSnapshot(series[band].lastAt(t)),
      el('div', { class: 'hint' }, series[band].others ? 'Click to hide the bigger ones and show these separately' : 'Click for its snapshots · double-click to open it'),
    ] : [
      when(t, isNow),
      ...[...series.keys()].reverse().map(i => row(i, j)),
      el('div', { class: 'row total' }, el('span', { class: 'key' }), el('b', {}, formatSize(tops[tops.length - 1][j])), el('span', {}, 'Total')),
      fromSnapshot(times[j]),
      el('div', { class: 'hint' }, 'Click to show files as of then'),
    ]));
    tip.hidden = false;
    const box = svg.getBoundingClientRect();
    const left = px / width * box.width;
    tip.style.left = `${left + (left > box.width / 2 ? -tip.offsetWidth - 12 : 12)}px`;
  });
  svg.addEventListener('pointerleave', () => {
    crosshair.setAttribute('visibility', 'hidden');
    tip.hidden = true;
    highlight(null);
  });
  svg.addEventListener('click', event => {
    // The second click of a double click is the double click's
    if (event.detail > 1) return;
    const { t, band, isNow } = pointed(event);
    if (band >= 0) return series[band].others ? openOthers() : series[band].pick();
    navigate({ asOf: isNow ? null : new Date(t).toISOString() });
  });
  svg.addEventListener('dblclick', event => {
    const { band } = pointed(event);
    if (band >= 0 && !series[band].others) series[band].open();
  });
  chart.replaceChildren(svg, tip);
  return highlight;
}

function renderMain() {
  const main = document.getElementById('main');
  if (state.folder) return renderFolder(main);
  const loc = storage.find(l => l.path === state.location);
  if (!loc) {
    main.replaceChildren(el('div', { class: 'panel empty' }, 'Pick a backup location on the left, or search for a path to see its history.'));
    return;
  }
  if (state.file) return renderFilePage(main, loc);
  const selected = selectedSnapshot(loc);

  // What's being looked at, at the snapshot being viewed: the folder's size and files, then for the
  // whole location its space on disk. The snapshot itself is named in the contents heading.
  const here = folderSummary(loc, selected);
  const head = el('section', { class: 'loc-head' },
    locationCrumbs(loc),
    el('div', { class: 'meta' },
      here ? el('span', {}, el('b', {}, formatSize(here.size))) : null,
      here ? el('span', {}, plural(here.files, 'file')) : null,
      state.scope ? null : el('span', {}, `${diskText(locationTotal(loc))} on disk`),
      // The as-of date is older than anything kept here, so the oldest snapshot stands in for it
      tooOld(loc) && !state.snapshot
        ? el('span', { class: 'badge', title: `Nothing here is as old as ${formatFull(state.asOf)}` }, 'No snapshot that old · showing the oldest')
        : null));

  // The folder as it was in the snapshot, to restore: its own modified time is in the listing of the
  // folder above it, or for the location, the snapshot's
  const complete = loc.snapshots.filter(s => !s.incomplete);
  const at = complete.indexOf(selected);
  const parts = state.scope ? state.scope.split('/') : [];
  const modified = !state.scope ? selected.mtime
    : snapshotListing(selected, parts.slice(0, -1).join('/'))?.find(e => e.n === parts[parts.length - 1] && e.t === 'd')?.m;
  const restore = restorePanel({
    selected, rel: state.scope, present: !!here, size: here?.size, what: 'folder', wide: true,
    facts: selected.incomplete ? [['Status', isCancelled(selected) ? 'Cancelled before it finished' : 'Still in progress']] : [
      ['Size', here ? formatSize(here.size) : notKnown()],
      ['Files', here ? plural(here.files, 'file') : notKnown()],
      ['Modified', modified ? `${formatFull(modified)}, ${timeAgo(modified)}` : notKnown()],
      ['In this snapshot', describeStep(at > 0 ? stepChange(complete[at - 1], selected, state.scope, true) : 'first', true)],
    ],
  });

  // What's in the folder at the snapshot picked in the right-hand panel, restoring it, its size across every
  // snapshot, then what changed in it, which can be long, and where the changes happen. The snapshots
  // themselves are on the right.
  main.replaceChildren(head, renderSnapshotContents(loc, selected), restore, renderSizeChart(loc), renderChanges(loc, selected), renderChurn(loc));
}

// The snapshot a location is shown at: the last complete one at or before the as-of date (the latest if
// none is set), or the oldest if it has none that old
function asOfSnapshot(loc) {
  const complete = loc.snapshots.filter(s => !s.incomplete);
  if (!state.asOf) return latest(loc);
  const cutoff = new Date(state.asOf);
  return [...complete].reverse().find(s => new Date(s.time) <= cutoff) || complete[0] || latest(loc);
}

// Whether a location has no snapshot as old as the as-of date
const tooOld = loc => !!state.asOf && loc.snapshots.every(s => s.incomplete || new Date(s.time) > new Date(state.asOf));

// A snapshot picked by hand wins; otherwise it's the one for the as-of date
const selectedSnapshot = loc => loc.snapshots.find(s => s.id === state.snapshot) || asOfSnapshot(loc);

// Size and file count of the folder in scope at a snapshot: the snapshot's own for the location's top,
// otherwise from the listing of the folder above it, or null if that wasn't captured
function folderSummary(loc, snap) {
  if (snap.incomplete) return null;
  if (!state.scope) return { size: snap.size, files: snap.files };
  const parts = state.scope.split('/');
  const entry = snapshotListing(snap, parts.slice(0, -1).join('/'))?.find(e => e.n === parts[parts.length - 1] && e.t === 'd');
  return entry ? { size: entry.s, files: entry.f } : null;
}

// The path being looked at in the middle: a file, the folder in scope, or a folder page
function currentPath() {
  const loc = storage.find(l => l.path === state.location);
  if (loc) return pathInScope(loc, state.file);
  return state.folder;
}

// The folder being looked at, which on a file's page is the folder it's in
function currentFolder() {
  const loc = storage.find(l => l.path === state.location);
  if (loc) return pathInScope(loc, null);
  return state.folder;
}

// The full Windows path of something in the folder in scope
function pathInScope(loc, name) {
  const inside = [state.scope, name].filter(Boolean).join('/');
  return inside ? `${loc.path.replace(/\\$/, '')}\\${inside.replaceAll('/', '\\')}` : loc.path;
}

// What's known about a file at a snapshot, from the folder listing where captured and from the diffs:
// whether it's there, its size and modified time, what changed since the snapshot before, and its history
function fileInfo(loc, rel, selected) {
  const complete = loc.snapshots.filter(s => !s.incomplete);
  const at = complete.indexOf(selected);
  const name = rel.slice(rel.lastIndexOf('/') + 1);
  const parent = rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';

  // Each snapshot where it was added, modified or removed, oldest first
  const steps = [];
  let captured = true;
  for (let i = 1; i < complete.length; i++) {
    const change = stepChange(complete[i - 1], complete[i], rel, false);
    if (change === null) captured = false;
    else if (change.kind) steps.push({ snap: complete[i], ...change });
  }
  const upTo = steps.filter(s => complete.indexOf(s.snap) <= at);
  const lastStep = upTo[upTo.length - 1];
  const listing = snapshotListing(selected, parent);
  const entry = listing?.find(e => e.n === name && e.t === 'f');
  // There if it's listed, otherwise going by its last change; if it never changed, it was there all along
  const present = listing ? !!entry : lastStep ? lastStep.kind !== '-' : !(steps[0]?.kind === '+');
  return {
    present, captured, steps,
    size: entry?.s ?? (lastStep && lastStep.kind !== '-' ? lastStep.size : null),
    modified: entry?.m ?? null,
    here: at > 0 ? stepChange(complete[at - 1], selected, rel, false) : 'first',
    firstSeen: steps[0]?.kind === '+' ? steps[0].snap : null,
    lastChanged: [...steps].reverse().find(s => s.kind !== '-')?.snap ?? null,
    snapshots: complete.length,
  };
}

// A file's own page: what it is at the snapshot being viewed, with its history in the snapshots panel
function renderFilePage(main, loc) {
  const full = pathInScope(loc, state.file);
  const rel = relativeTo(loc, full);
  const selected = selectedSnapshot(loc);
  const crumbs = locationCrumbs(loc);
  // The folder it's in becomes a link back to that folder
  const last = crumbs.lastElementChild;
  last.replaceWith(el('button', { onclick: () => navigate({ file: null }) }, last.textContent));
  crumbs.append(el('span', {}, '\\'), el('span', { class: 'current' }, state.file));

  const info = fileInfo(loc, rel, selected);
  const when = snap => `${formatFull(snap.time)}, ${timeAgo(snap.time)}`;
  const changedIn = info.steps.filter(s => s.kind !== '-').length;
  // Back to the folder, with the file picked there so its row is highlighted
  const showInFolder = () => { pickedRow = full; pickedIsFolder = false; navigate({ file: null, history: full }); };

  main.replaceChildren(
    el('section', { class: 'loc-head' }, crumbs,
      el('div', { class: 'meta' },
        info.present && info.size != null ? el('span', {}, el('b', {}, formatSize(info.size))) : null,
        info.modified ? el('span', {}, `modified ${formatFull(info.modified)}`) : null,
        info.present ? null : el('span', { class: 'c-removed' }, 'Not in this snapshot'))),
    restorePanel({
      selected, rel, present: info.present, size: info.size, what: 'version',
      facts: [
        ...(info.present ? [
          ['Size', info.size != null ? formatSize(info.size) : notKnown()],
          ['Modified', info.modified ? `${formatFull(info.modified)}, ${timeAgo(info.modified)}` : notKnown()],
        ] : [['Status', el('span', { class: 'c-removed' }, 'Not in this snapshot')]]),
        ['In this snapshot', describeStep(info.here, false)],
        ['Changed in', info.captured ? `${changedIn} of ${plural(info.snapshots, 'snapshot')}` : notKnown()],
        ['First backed up', info.firstSeen ? when(info.firstSeen) : 'In the oldest snapshot still kept'],
        ['Last changed', info.lastChanged ? when(info.lastChanged) : info.captured ? 'Not since the oldest snapshot' : notKnown()],
      ],
      buttons: [el('button', { class: 'btn', onclick: showInFolder, title: 'Go to the folder it\'s in, here in the explorer' }, 'Go to folder')],
      note: 'Every snapshot where it changed, and how, is in the snapshots panel on the right.',
    }));
}

// The Restore panel on file and folder pages: what it was like in the snapshot being viewed, and a button
// to restore it as it was then. Folders' fewer facts go two to a row, to keep it short above the contents.
function restorePanel({ selected, rel, present, size, what, facts, buttons = [], note = null, wide = false }) {
  const detail = ([label, value]) => [el('dt', {}, label), el('dd', {}, value)];
  const loc = storage.find(l => l.snapshots.includes(selected));
  const onDisk = rel ? `${loc.path.replace(/\\$/, '')}\\${rel.replaceAll('/', '\\')}` : loc.path;
  const explorerButton = el('button', {
    class: 'btn', disabled: !LIVE,
    title: LIVE ? `Open ${onDisk} in Windows Explorer, as it is now (or the nearest folder above it, if it's gone)`
      : 'Opening Explorer needs the server: run kopia_explorer.py',
    onclick: () => showInExplorer(onDisk, explorerButton),
  }, 'Show in Explorer');
  return el('section', { class: 'panel' },
    el('div', { class: 'chart-head' },
      el('h2', {}, 'Restore'),
      el('span', { class: 'legend' }, `At ${formatFull(selected.time)}, ${timeAgo(selected.time)} (${shortId(selected.id)})`)),
    el('dl', { class: `facts${wide ? ' wide' : ''}` }, facts.map(detail)),
    el('div', { class: 'facts-actions' },
      el('button', {
        class: 'btn primary', disabled: !LIVE || !present || beingDeleted(selected),
        title: !LIVE ? 'Restoring needs the server: run kopia_explorer.py' : !present ? 'It isn\'t in this snapshot'
          : beingDeleted(selected) ? 'This snapshot is being deleted'
          : `${what === 'folder' ? 'Pick a folder to put it in' : 'Pick where to save it'}, keeping modified dates, as it was on ${formatFull(selected.time)}`,
        onclick: () => restoreItem(selected, rel, what === 'folder'),
      }, `Restore this ${what}${size != null ? ` (${formatSize(size)})` : ''}…`),
      explorerButton, buttons),
    note ? el('p', { class: 'note', style: 'margin:10px 0 0' }, note) : null);
}

// The listing of the folder in scope at a snapshot: an array of entries, null if the folder
// isn't in that snapshot, or undefined if it isn't loaded (yet) or wasn't captured. Listings missing on
// the way are loaded unless only peeking.
function snapshotListing(snap, scope, fetchIfMissing = true) {
  let obj = snap.root;
  for (const part of scope ? scope.split('/') : []) {
    const entries = api.listing(obj, fetchIfMissing);
    if (!entries) return undefined;
    const entry = entries.find(e => e.n === part && e.t === 'd');
    if (!entry) return null;
    obj = entry.o;
  }
  return api.listing(obj, fetchIfMissing);
}

// The nearest location a location sits inside, with the scope of the folder containing it there
function enclosingLocation(loc) {
  const path = loc.path.replace(/\\$/, '');
  const parentPath = path.slice(0, path.lastIndexOf('\\'));
  const outer = storage
    .filter(l => l !== loc && path.toLowerCase().startsWith(l.path.replace(/\\$/, '').toLowerCase() + '\\'))
    .sort((a, b) => b.path.length - a.path.length)[0];
  if (!outer) return null;
  const scope = parentPath.slice(outer.path.replace(/\\$/, '').length + 1).replaceAll('\\', '/');
  return { loc: outer, scope, parentPath };
}

// Contents of the folder in scope at the selected snapshot, like an Explorer window
function renderSnapshotContents(loc, selected) {
  const node = treeNodes.get(loc.path.toLowerCase());
  const panel = el('section', { class: 'panel' });
  const head = el('div', { class: 'chart-head' },
    el('h2', {}, 'Contents'),
    el('span', { class: 'legend' }, `At ${formatFull(selected.time)}, ${timeAgo(selected.time)} (${shortId(selected.id)})`));
  if (selected.incomplete) {
    appendAll(panel, head, el('p', { class: 'note' }, `This snapshot ${unfinished(selected)}, so its contents aren't shown.`));
    return panel;
  }
  const entries = snapshotListing(selected, state.scope);
  if (entries === undefined) {
    // Not known: fall back to the locations nested inside, if there are any
    if (node && node.children.size && !state.scope && !pending.size) return renderContents(node);
    appendAll(panel, head, el('p', { class: 'note' }, notLoaded('folder listings')));
    return panel;
  }
  if (entries === null) {
    appendAll(panel, head, el('p', { class: 'note' }, 'This folder isn\'t in this snapshot.'));
    return panel;
  }

  // Up a folder: within the location while in a subfolder; from the top of a location that's inside
  // another, into the outer location at the folder containing it; otherwise to the folder page above
  const scopeParts = state.scope ? state.scope.split('/') : [];
  const above = node && parentNode(node);
  const outer = enclosingLocation(loc);
  const up = scopeParts.length
    ? { label: [loc.path.replace(/\\$/, ''), ...scopeParts.slice(0, -1)].join('\\'), go: () => navigate({ scope: scopeParts.slice(0, -1).join('/') }) }
    : outer ? { label: outer.parentPath, go: () => navigate({ location: outer.loc.path, snapshot: null, scope: outer.scope }) }
    : above ? { label: above.path, go: () => navigate(above.location ? { location: above.location.path, snapshot: null } : { folder: above.path }) } : null;

  const base = [loc.path.replace(/\\$/, ''), ...scopeParts].join('\\');
  const items = entries.map(entry => {
    const full = `${base}\\${entry.n}`;
    const nested = entry.t === 'd' ? treeNodes.get(full.toLowerCase())?.location : null;
    return {
      key: full, label: entry.n, folder: entry.t === 'd', location: nested,
      size: entry.s, files: entry.t === 'd' ? entry.f : null, modified: entry.m,
      pick: () => openHistory(entry.n, entry.t === 'd'),
      // Double click goes into it: a nested location, a folder, or a file's own page
      open: nested ? () => navigate({ location: nested.path, snapshot: null })
        : entry.t === 'd' ? () => navigate({ scope: [...scopeParts, entry.n].join('/') })
        : () => navigate({ file: entry.n }),
    };
  });
  return contentsTable(`At ${formatFull(selected.time)}, ${timeAgo(selected.time)} (${shortId(selected.id)})`, up, items,
    () => renderSnapshotContents(loc, selected));
}

/* ---------- Contents table, the same for folder pages and snapshot listings ---------- */

// items: { key, label, prefix?, folder, location?, live?, size, files, modified, pick?, open }
// up: { label, go } or null. rerender returns a fresh copy of the panel, for re-sorting.
function contentsTable(legend, up, items, rerender) {
  const columns = [
    { key: 'name', label: 'Name', value: i => (i.prefix || '') + i.label },
    { key: 'size', label: 'Size', value: i => i.size, desc: true },
    // A file counts as -1 files, so it sorts just below a folder with none, without folders being kept first
    { key: 'files', label: 'Files', value: i => i.folder ? i.files : -1, desc: true, mixed: true },
    { key: 'modified', label: 'Modified', value: i => i.modified, desc: true },
  ];
  const sorted = sortRows(items, tableSorts.contents, columns, i => i.folder, i => (i.prefix || '') + i.label);
  const positions = gradientPositions(sorted.map(i => i.size).filter(Boolean));
  const row = item => pickableRow(item.key, item.pick, item.open,
    `${item.pick ? 'Click for its history · ' : ''}Double-click to open${item.location ? ` (${item.location.path} is a backup location)` : ''}`,
    el('td', {},
      el('span', { class: 'mono' },
        item.location ? el('span', { class: 'swatch', style: 'background:var(--accent);border-radius:50%' }) : null,
        item.prefix ? el('span', { class: 'muted' }, item.prefix) : null,
        item.label + (item.folder ? '\\' : '')),
      item.live ? el('span', { class: 'badge', style: 'margin-left:8px' }, 'Live') : null),
    el('td', { class: 'num', style: item.size ? `color:${textColour(gradientRgb(positions.get(item.size)))}` : null }, formatSize(item.size)),
    el('td', { class: 'num' }, item.folder && item.files != null ? plural(item.files, 'file') : ''),
    el('td', { class: 'num' }, item.modified ? formatFull(item.modified) : ''));
  const panel = el('section', { class: 'panel' },
    el('div', { class: 'chart-head' }, el('h2', {}, 'Contents'), legend ? el('span', { class: 'legend' }, legend) : null),
    el('div', { class: 'table-wrap' },
      el('table', {},
        sortableHead(tableSorts.contents, columns, () => panel.replaceWith(rerender())),
        el('tbody', {},
          up ? upTableRow(up.label, up.go, 3) : null,
          sorted.map(row),
          sorted.length ? null : el('tr', {}, el('td', { class: 'muted', colspan: 4 }, 'Empty folder'))))));
  return panel;
}

/* ---------- Sortable tables with pickable rows ---------- */

// How each table is sorted, kept while moving between folders
const tableSorts = { contents: { key: 'name', desc: false } };

// A header row whose headings sort the table; clicking the current one reverses it
function sortableHead(sort, columns, rerender) {
  return el('thead', {}, el('tr', {}, columns.map(col => {
    const active = sort.key === col.key;
    return el('th', { 'aria-sort': active ? (sort.desc ? 'descending' : 'ascending') : null },
      el('button', {
        class: 'sort-head', title: active ? 'Click again to reverse' : `Sort by ${col.label.toLowerCase()}`,
        onclick: () => {
          if (active) sort.desc = !sort.desc;
          else { sort.key = col.key; sort.desc = !!col.desc; }
          rerender();
        },
      }, col.label, active ? (sort.desc ? ' ▼' : ' ▲') : ''));
  })));
}

// Sort like Windows: folders above files, then by the chosen column, then by name. Reversing a column
// reverses the whole list, so folders go below files, as Windows does.
// A column marked mixed sorts folders and files together by its value alone.
// Empty values always go last, whichever way it's sorted.
function sortRows(items, sort, columns, isFolder, name) {
  const column = columns.find(c => c.key === sort.key);
  const value = column.value;
  const direction = sort.desc ? -1 : 1;
  const foldersFirst = !!sort.desc === !!column.desc;
  const byName = (a, b) => name(a).localeCompare(name(b), 'en', { sensitivity: 'base' });
  return [...items].sort((a, b) => {
    if (!column.mixed && isFolder(a) !== isFolder(b)) return (foldersFirst ? 1 : -1) * (isFolder(b) - isFolder(a));
    const x = value(a), y = value(b);
    if ((x == null) !== (y == null)) return (x == null) - (y == null);
    const order = x == null ? 0 : typeof x === 'string' ? x.localeCompare(y, 'en', { sensitivity: 'base' }) : x - y;
    return direction * order || byName(a, b);
  });
}

// The row last clicked, highlighted until something else is
let pickedRow = null;

// Make a row picked (and show its history) on a single click, and opened on a double click.
// The second click of a double click is ignored, so it doesn't land on whatever replaced the row.
function makePickable(row, key, pick, open) {
  if (key === pickedRow) row.classList.add('picked');
  row.addEventListener('click', event => {
    if (event.detail > 1) return;
    pickedRow = key;
    row.parentElement.querySelectorAll(':scope > .picked').forEach(r => r.classList.remove('picked'));
    row.classList.add('picked');
    pick?.();
  });
  if (open) row.addEventListener('dblclick', open);
  return row;
}

const pickableRow = (key, pick, open, title, ...cells) => makePickable(el('tr', { title }, ...cells), key, pick, open);

// A ".." row: a single click picks the folder you're in and shows its history, a double click goes up
function upTableRow(label, go, span) {
  const here = currentPath();
  return pickableRow(`..${here}`, here ? () => navigate({ history: null }) : null, go,
    `Click for this folder's snapshots · double-click to go up to ${label}`,
    el('td', {}, el('span', { class: 'mono' }, '..')), el('td', { class: 'muted', colspan: span }, `Up to ${label}`));
}

/* ---------- Where the changes happen ---------- */

// Activity across every step from one snapshot to the next, added up into a folder tree, plus per file.
// Each step counts separately, as this measures churn: a file rewritten ten times counts ten times.
// For each folder and file: counts of each kind, data written (added and modified files) and removed,
// and per step what happened, for the activity strips.
const churnCache = new Map();
const newActivity = () => ({ counts: { '+': 0, '-': 0, '~': 0 }, written: 0, removed: 0, steps: new Map() });
function addActivity(activity, change, step) {
  activity.counts[change.k]++;
  if (change.k === '-') activity.removed += change.s || 0;
  else activity.written += change.s || 0;
  if (!activity.steps.has(step)) activity.steps.set(step, { '+': 0, '-': 0, '~': 0, bytes: 0 });
  const tick = activity.steps.get(step);
  tick[change.k]++;
  tick.bytes += change.s || 0;
}

function locationChurn(loc) {
  if (churnCache.has(loc.path)) return churnCache.get(loc.path);
  // own is what happened to files directly in the folder, as opposed to in its subfolders
  const newNode = () => ({ ...newActivity(), own: newActivity(), children: new Map() });
  const root = newNode();
  const files = new Map();
  const complete = loc.snapshots.filter(s => !s.incomplete);
  // Each step ends at a snapshot; captured says whether its changes are known
  const steps = complete.slice(1).map((snap, i) => ({ snap, captured: !!api.diff(complete[i].id, snap.id) }));
  steps.forEach(({ snap }, step) => {
    for (const change of api.diff(complete[step].id, snap.id) || []) {
      if (change.p.endsWith('/')) continue;
      const parts = change.p.split('/');
      let node = root;
      addActivity(node, change, step);
      for (const part of parts.slice(0, -1)) {
        if (!node.children.has(part)) node.children.set(part, newNode());
        node = node.children.get(part);
        addActivity(node, change, step);
      }
      addActivity(node.own, change, step);
      if (!files.has(change.p)) files.set(change.p, newActivity());
      addActivity(files.get(change.p), change, step);
    }
  });
  const result = steps.some(s => s.captured) ? { root, files, steps, first: complete[0], last: complete[complete.length - 1] } : null;
  // Live diffs may still be loading, so it's only kept once they're all in
  if (!LIVE || steps.every(s => s.captured)) churnCache.set(loc.path, result);
  return result;
}

// Looking inside a folder scopes the whole page to it, including the changes panel
const drillChurn = path => navigate({ scope: path });

function renderChurn(loc) {
  const panel = el('section', { class: 'panel' });
  const churn = locationChurn(loc);
  if (!churn) {
    panel.append(el('h2', {}, 'Where the changes happen'), el('p', { class: 'note' }, notLoaded('changes')));
    return panel;
  }

  // Walk down to the folder in scope; nothing below it changed if it isn't there
  const parts = state.scope ? state.scope.split('/') : [];
  let node = churn.root;
  for (const part of parts) node = node?.children.get(part);
  const legend = el('span', { class: 'legend' },
    `Data added, modified and removed across ${plural(churn.steps.length, 'snapshot')}, ${formatTime(churn.first.time)} – ${formatTime(churn.last.time)}`);
  if (!node) {
    panel.append(el('div', { class: 'chart-head' }, el('h2', {}, 'Where the changes happen'), legend),
      el('p', { class: 'note' }, 'Nothing in this folder changed across these snapshots.'));
    return panel;
  }

  const fullPath = rel => `${loc.path.replace(/\\$/, '')}\\${rel.replaceAll('/', '\\')}`;
  const total = activity => activity.written + activity.removed;
  const changes = activity => activity.counts['+'] + activity.counts['-'] + activity.counts['~'];

  const byTotal = (a, b) => total(b.activity) - total(a.activity) || changes(b.activity) - changes(a.activity);
  // Folders first, like Contents
  const folders = [...node.children].map(([name, child]) => {
    const rel = [...parts, name].join('/');
    return {
      key: `churn:${rel}`, label: `${name}/`, activity: child,
      // Rows click like Contents: a single click shows a folder's history, a double click goes into it
      pick: () => { pickedIsFolder = true; navigate({ history: fullPath(rel) }); },
      open: () => drillChurn(rel),
    };
  }).filter(row => changes(row.activity)).sort(byTotal);
  const limit = 12;
  const rest = folders.slice(limit);

  // Then the files directly in this folder, those changed in the most snapshots first, as files
  // rewritten again and again are the ones worth noticing
  const prefix = parts.length ? `${parts.join('/')}/` : '';
  const rewrites = activity => [...activity.steps.values()].filter(t => t['+'] || t['~']).length;
  const files = [...churn.files]
    .filter(([path]) => path.startsWith(prefix) && !path.slice(prefix.length).includes('/'))
    .map(([path, activity]) => ({
      key: `churn-file:${path}`, label: path.slice(prefix.length), activity,
      pick: () => { pickedIsFolder = false; navigate({ history: fullPath(path) }); },
      open: () => navigate({ scope: state.scope, file: path.slice(prefix.length) }),
    }))
    .sort((a, b) => rewrites(b.activity) - rewrites(a.activity) || byTotal(a, b));
  const moreFiles = files.slice(limit);

  const shown = [...folders.slice(0, limit), ...files.slice(0, limit)];
  // One scale for every row's bar and colour, so they compare
  const max = Math.max(1, ...shown.map(r => total(r.activity)));
  const positions = gradientPositions(shown.map(r => total(r.activity)).filter(Boolean));

  // A tick per step, lit where something changed, coloured by what kind of change it was.
  // The ticks for the snapshot being viewed are ringed, down every row.
  const viewed = selectedSnapshot(loc);
  const strip = (activity, rowKey) => el('span', { class: 'strip' }, churn.steps.map(({ snap, captured }, step) => {
    const tick = activity.steps.get(step);
    const kind = !tick ? '' : tick['~'] || (tick['+'] && tick['-']) ? 'modified' : tick['+'] ? 'added' : 'removed';
    const what = tick ? ['+', '-', '~'].filter(k => tick[k]).map(k => `${k === '-' ? '−' : k}${tick[k]}`).join(' ') : captured ? 'no changes' : 'not captured';
    return el('span', {
      class: `tick ${kind || (captured ? '' : 'unknown')}${snap === viewed ? ' viewed' : ''}`,
      title: `${formatFull(snap.time)} (${timeAgo(snap.time)}): ${what}${tick ? `, ${formatSize(tick.bytes)}` : ''}`,
      // A tick is a moment for the folder being looked at, so it views that snapshot here, with the
      // snapshots panel back on this folder rather than on the row's item, and the row highlighted
      onclick: event => {
        event.stopPropagation();
        pickedRow = rowKey;
        navigate({ asOf: asOfFor(loc, snap), history: null });
      },
    });
  }));

  const churnRow = row => {
    const a = row.activity;
    const sum = total(a);
    const fill = sum ? fillColour(gradientRgb(positions.get(sum))) : null;
    return makePickable(
      el('div', { class: 'churn-row', title: 'Click for its history · double-click to open' },
        el('span', { class: 'churn-name', title: row.label }, el('span', { class: 'own' }, row.label)),
        // Written and removed side by side, so deletions count as activity too
        el('div', { class: 'churn-track', title: `${formatSize(a.written)} added or modified · ${formatSize(a.removed)} removed` },
          a.written ? el('div', { class: 'churn-fill', style: `width:${100 * a.written / max}%;background:${fill}` }) : null,
          a.removed ? el('div', { class: 'churn-fill removed', style: `width:${100 * a.removed / max}%` }) : null),
        el('span', { class: 'num' }, formatSize(sum)),
        strip(a, row.key),
        el('span', { class: 'agg' }, ['+', '-', '~'].filter(k => a.counts[k]).map(k =>
          el('span', { class: { '+': 'c-added', '-': 'c-removed', '~': 'c-modified' }[k] }, `${k === '-' ? '−' : k}${a.counts[k].toLocaleString('en-GB')}`)))),
      row.key, row.pick || null, row.open || null);
  };

  const columns = `--ticks:${churn.steps.length}`;
  appendAll(panel,
    el('div', { class: 'chart-head' }, el('h2', {}, 'Where the changes happen'), legend),
    shown.length ? el('div', { class: 'churn', style: columns }, shown.map(churnRow)) : el('p', { class: 'note' }, 'No changes here.'),
    rest.length || moreFiles.length ? el('p', { class: 'note', style: 'margin:6px 0 0' }, '…and ', [
      rest.length ? plural(rest.length, 'more folder') : null,
      moreFiles.length ? plural(moreFiles.length, 'more file') : null,
    ].filter(Boolean).join(' and '),
    ` with ${formatSize([...rest, ...moreFiles].reduce((n, r) => n + total(r.activity), 0))} between them`) : null);
  return panel;
}

// Viewing a snapshot sets "files as of" to its time, so every location follows; the newest goes back to now
const asOfFor = (loc, snap) => (snap === latest(loc) ? null : snap.time);

// Clicking a snapshot views it; Shift-clicking compares the one being viewed with it instead
function pickSnapshot(snap, selected, compare) {
  if (compare && !snap.incomplete && snap !== selected && !selected.incomplete) navigate({ compare: snap.id });
  else navigate({ asOf: asOfFor(storage.find(l => l.snapshots.includes(snap)), snap) });
}

/* ---------- Changes in the selected snapshot ---------- */

// How much bigger a change made things: a file's size added or removed, or how much a modified one grew.
// Something that only existed in between (*) is gone again, so made no difference.
const changeDelta = c => (c.k === '+' ? c.s || 0 : c.k === '-' ? -(c.s || 0) : c.k === '~' && c.o != null ? c.s - c.o : 0);
const KIND_CLASS = { '+': 'c-added', '-': 'c-removed', '~': 'c-modified', d: 'c-modified' };

// kopia lists the files inside folders added or removed whole too, so a folder's counts and net change
// come from the files below it, whatever happened to the folder itself
function buildTree(changes) {
  const newNode = (name, path) => ({ name, path, children: new Map(), counts: { '+': 0, '-': 0, '~': 0, '*': 0, d: 0 }, delta: 0 });
  const root = newNode('', '');
  for (const change of changes) {
    const isDir = change.p.endsWith('/');
    const parts = change.p.replace(/\/$/, '').split('/');
    const delta = isDir ? 0 : changeDelta(change);
    let node = root;
    parts.forEach((part, i) => {
      if (!node.children.has(part)) node.children.set(part, newNode(part, parts.slice(0, i + 1).join('/')));
      node = node.children.get(part);
      // Files count towards every folder above them
      if (!isDir && i < parts.length - 1) {
        node.counts[change.k]++;
        node.delta += delta;
      }
    });
    if (!isDir) {
      root.counts[change.k]++;
      root.delta += delta;
    }
    node.change = change;
  }
  return root;
}

// Every row's net change in a tree, for colouring them on one scale
function treeDeltas(node, found = []) {
  if (node.change && !node.change.d) found.push(Math.abs(changeDelta(node.change)));
  else found.push(Math.abs(node.delta));
  for (const child of node.children.values()) treeDeltas(child, found);
  return found;
}

// Fold the changes of consecutive steps into one net change per path, like snapshot_diff.py --group:
// whether a path exists at the start and end decides the result, so something deleted and re-added
// in between is modified, and something that only existed in between is transient (*), shown greyed out
function foldDiffs(lists) {
  const history = new Map();
  for (const list of lists) {
    for (const change of list) {
      const item = history.get(change.p);
      if (item) item.last = change;
      else history.set(change.p, { first: change, last: change });
    }
  }
  const result = [];
  for (const { first, last } of history.values()) {
    const existedFirst = first.k !== '+';
    const existsLast = last.k !== '-';
    if (!existedFirst && !existsLast) {
      // Only existed in between: kept as * at its last size, for showing on request
      result.push({ ...last, k: '*' });
    } else if (existedFirst && existsLast) {
      // Folders that existed at both ends are left to their contents to describe
      if (first.d || last.d) continue;
      result.push({ k: '~', p: last.p, s: last.s, o: first.k === '~' ? first.o : first.s });
    } else {
      result.push({ ...(existsLast ? last : first), k: existsLast ? '+' : '-' });
    }
  }
  return result;
}

// Files whose modified date changed between two snapshots but not their contents, which kopia's diff only counts:
// the server finds them, comparing just the folders kopia names. Paths are inside the folder in scope;
// contentPaths are the changes the diff found, which aren't repeated. complete is false while they load.
function dateOnlyChanges(older, newer, scope, contentPaths) {
  const list = api.dates(older.id, newer.id);
  if (!list) return { found: [], complete: false };
  const prefix = scope ? `${scope}/` : '';
  const found = list.filter(c => c.p.startsWith(prefix)).map(c => ({ ...c, p: c.p.slice(prefix.length) }))
    .filter(c => !contentPaths.has(c.p));
  return { found, complete: true };
}

// Changes between two complete snapshots of a location, oldest first, or null if not captured
function diffBetween(loc, older, newer) {
  const complete = loc.snapshots.filter(s => !s.incomplete);
  const from = complete.indexOf(older), to = complete.indexOf(newer);
  const lists = [];
  for (let i = from; i < to; i++) {
    const list = api.diff(complete[i].id, complete[i + 1].id);
    if (!list) return null;
    lists.push(list);
  }
  return lists.length === 1 ? lists[0] : foldDiffs(lists);
}

// Every snapshot newest first, like the table, with the selected one shown in place but disabled
function compareSelect(complete, selected, other) {
  const newest = complete[complete.length - 1];
  const option = snap => {
    const label = `${formatFull(snap.time)} · ${timeAgo(snap.time)} (${shortId(snap.id)})${snap === newest ? ' · latest' : ''}`;
    return snap === selected
      ? el('option', { value: snap.id, disabled: true }, `${label} · this snapshot`)
      : el('option', { value: snap.id, selected: other && snap.id === other.id }, label);
  };
  return el('label', { class: 'compare' }, 'Compare with',
    el('select', { onchange: event => navigate({ compare: event.target.value || null }) },
      other ? null : el('option', { value: '', selected: true }, 'Pick a snapshot'),
      [...complete].reverse().map(option)));
}

// The snapshot the selected one is compared with: the chosen one, or by default the nearest earlier one
// with changes in the folder in scope since, so there's something to see. Steps whose changes aren't
// loaded yet count if the snapshots differ at all. With no changes since the oldest, it's the oldest.
function compareTarget(loc, selected) {
  if (selected.incomplete) return undefined;
  const complete = loc.snapshots.filter(s => !s.incomplete);
  const chosen = complete.find(s => s.id === state.compare && s !== selected);
  if (chosen) return chosen;
  // Anything at or below the folder in scope, including folders added or removed whole
  const prefix = state.scope ? `${state.scope}/` : '';
  for (let i = complete.indexOf(selected); i > 0; i--) {
    const [older, newer] = [complete[i - 1], complete[i]];
    if (older.root === newer.root) continue;
    const list = api.diff(older.id, newer.id);
    if (!list || list.some(c => c.p.startsWith(prefix))) return older;
  }
  return complete.indexOf(selected) > 0 ? complete[0] : undefined;
}

function renderChanges(loc, selected) {
  const panel = el('section', { class: 'panel' });
  if (selected.incomplete) {
    panel.append(el('h2', {}, 'Changes'), el('p', { class: 'note' }, `This snapshot ${unfinished(selected)}, so its changes aren't shown.`));
    return panel;
  }
  const complete = loc.snapshots.filter(s => !s.incomplete);
  const index = complete.indexOf(selected);
  const other = compareTarget(loc, selected);
  const select = compareSelect(complete, selected, other);
  const title = legend => el('div', { class: 'chart-head' }, el('h2', {}, 'Changes'), legend ? el('span', { class: 'legend' }, legend) : null);
  if (!other) {
    appendAll(panel, title(), el('div', { class: 'changes-head' }, el('div', { class: 'line' }, select)),
      el('p', { class: 'note' }, 'This is the oldest snapshot, so pick a later one to compare it with.'));
    return panel;
  }
  const [older, newer] = complete.indexOf(other) < index ? [other, selected] : [selected, other];
  // Only steps where something changed count as combined; identical snapshots add nothing
  const range = complete.slice(complete.indexOf(older), complete.indexOf(newer) + 1);
  const steps = range.slice(1).filter((s, i) => s.root !== range[i].root).length;
  const identical = range.length - 1 - steps;
  const changes = diffBetween(loc, older, newer);
  if (!changes) {
    appendAll(panel, title(), el('div', { class: 'changes-head' }, el('div', { class: 'line' }, select)),
      el('p', { class: 'note' }, notLoaded('changes')));
    return panel;
  }

  // Only what's inside the folder in scope, with paths starting inside it
  const prefix = state.scope ? `${state.scope}/` : '';
  const inScope = prefix
    ? changes.filter(c => c.p.startsWith(prefix) && c.p.length > prefix.length).map(c => ({ ...c, p: c.p.slice(prefix.length) }))
    : changes;
  // Files whose modified date changed but not their contents, when asked for, as finding them takes loading
  const dates = state.filters.d ? dateOnlyChanges(older, newer, state.scope, new Set(inScope.map(c => c.p))) : null;
  const scoped = dates ? [...inScope, ...dates.found] : inScope;
  const tree = buildTree(scoped);
  // Files that only existed between the snapshots compared, which are shown greyed out
  const transient = tree.counts['*'];
  const counts = el('span', { class: 'counts' },
    el('span', { class: 'c-added' }, `+${tree.counts['+'].toLocaleString('en-GB')}`),
    el('span', { class: 'c-removed' }, `−${tree.counts['-'].toLocaleString('en-GB')}`),
    el('span', { class: 'c-modified' }, `~${tree.counts['~'].toLocaleString('en-GB')}`),
    dates ? el('span', { class: 'c-modified', title: 'Files whose modified date changed but not their contents' },
      dates.complete ? `•${tree.counts.d.toLocaleString('en-GB')}` : '•…') : null);
  const toggle = k => { state.filters[k] = !state.filters[k]; panel.replaceWith(renderChanges(loc, selected)); };
  const filters = el('span', { class: 'filters' }, ['+', '-', '~'].map(k => el('button', {
    class: { '+': 'c-added', '-': 'c-removed', '~': 'c-modified' }[k], 'aria-pressed': String(state.filters[k]),
    title: `Show ${{ '+': 'added', '-': 'removed', '~': 'modified' }[k]}`,
    onclick: () => toggle(k),
  }, k === '-' ? '−' : k)),
  el('button', {
    class: 'c-modified dates', 'aria-pressed': String(state.filters.d), onclick: () => toggle('d'), disabled: !LIVE,
    title: LIVE ? 'Also show files whose modified date changed but not their contents, such as ones git or a game touched'
      : 'Needs the server: run kopia_explorer.py',
  }, '•'));
  const text = el('input', {
    class: 'filter-text', placeholder: 'Filter paths…', value: state.filterText, 'aria-label': 'Filter paths',
    oninput: event => { state.filterText = event.target.value; treeBox.replaceChildren(...topFolder(filtered())); },
  });
  const treeBox = el('div', { class: 'tree' });
  const filtered = () => {
    const needle = state.filterText.toLowerCase();
    return buildTree(scoped.filter(c => state.filters[c.k] && (!needle || c.p.toLowerCase().includes(needle))));
  };
  const visible = filtered();
  // Everything sits under the folder being looked at, so collapsing that collapses it all
  const folderName = state.scope ? state.scope.split('/').pop() : loc.path.replace(/\\$/, '').split('\\').pop() || loc.path;
  function topFolder(root) {
    if (!root.children.size) return [];
    // Coloured on the scale of what's shown, so it's recalculated as the filters change
    const sizePositions = gradientPositions(treeDeltas(root).filter(Boolean));
    // Headings sort the tree like the contents table's; clicking the current one reverses it
    const sort = tableSorts.changes;
    const head = el('div', { class: 'node head' }, el('span'), el('span'), changeColumns.map(col => {
      const active = sort.key === col.key;
      return el('span', { class: col.cls || null, 'aria-sort': active ? (sort.desc ? 'descending' : 'ascending') : null },
        el('button', {
          class: 'sort-head', title: `${col.title ? `${col.title} · ` : ''}${active ? 'Click again to reverse' : 'Click to sort'}`,
          onclick: () => {
            if (active) sort.desc = !sort.desc;
            else { sort.key = col.key; sort.desc = !!col.desc; }
            treeBox.replaceChildren(...topFolder(filtered()));
          },
        }, col.label, active ? (sort.desc ? ' ▼' : ' ▲') : ''));
    }));
    return [head, renderNode({ ...root, name: folderName, path: '' }, sizePositions, true)];
  }
  treeBox.append(...topFolder(visible));
  if (!visible.children.size) {
    // kopia stored the folder differently, so with no contents changed, dates did: say so, rather than nothing
    const parts = state.scope ? state.scope.split('/') : [];
    const folderObj = snap => (!state.scope ? snap.root
      : snapshotListing(snap, parts.slice(0, -1).join('/'))?.find(e => e.n === parts[parts.length - 1] && e.t === 'd')?.o);
    const [before, after] = [folderObj(older), folderObj(newer)];
    const datesHidden = LIVE && !state.filters.d && !scoped.length && before && after && before !== after;
    treeBox.append(datesHidden
      ? el('p', { class: 'note' }, 'No contents changed here, only modified dates. ',
        el('button', { class: 'linklike', onclick: () => toggle('d') }, 'Show them'))
      : el('p', { class: 'note' }, scoped.length ? 'Nothing matches the filters.'
        : state.scope ? 'Nothing in this folder changed in this snapshot.' : 'No changes in this snapshot.'));
  }

  // How several snapshots' changes were combined, in as few words as what applies needs
  const skipped = identical ? ` (${plural(identical, 'identical one')} skipped)` : '';
  const combined = steps > 1
    ? `Changes from ${steps} snapshots combined${skipped}. Anything deleted and re-added in between shows as modified${
      transient ? `; the ${transient === 1 ? 'file' : plural(transient, 'file')} greyed out only existed in between.` : '.'}`
    : identical ? `${plural(identical, 'identical snapshot')} in between skipped.` : null;
  appendAll(panel,
    title(`${formatFull(older.time)} (${timeAgo(older.time)}) → ${formatFull(newer.time)} (${timeAgo(newer.time)})`),
    el('div', { class: 'changes-head' }, el('div', { class: 'line' }, select, counts, filters, text)),
    combined ? el('p', { class: 'note', style: 'margin:-4px 0 10px' }, combined) : null,
    treeBox);
  return panel;
}

// Render the whole changes tree from its root; every folder starts open
const renderTree = (root, sizePositions) => renderNodes(root, sizePositions);

// The changes tree's columns, for sorting. A row merged with the folders leading to it (see compact)
// sorts by what it shows, which is the last of them.
const isChangeFolder = n => n.children.size > 0 || !!n.change?.d;
const rowNode = n => compact(n).node;
const changeCount = k => n => (isChangeFolder(rowNode(n)) ? rowNode(n).counts[k] : null);
const changeColumns = [
  { key: 'name', label: 'Name', value: n => n.name },
  { key: '+', label: '+', title: 'Files added', cls: 'c-added', desc: true, value: changeCount('+') },
  { key: '-', label: '−', title: 'Files removed', cls: 'c-removed', desc: true, value: changeCount('-') },
  { key: '~', label: '~', title: 'Files modified', cls: 'c-modified', desc: true, value: changeCount('~') },
  { key: 'size', label: 'Size', desc: true, value: n => rowNode(n).change?.s ?? null },
  { key: 'change', label: 'Change', title: 'How much bigger or smaller', desc: true,
    value: n => (isChangeFolder(rowNode(n)) ? rowNode(n).delta : changeDelta(rowNode(n).change)) },
];
tableSorts.changes = { key: 'name', desc: false };

// Render a folder's children, sorted by the chosen column like the contents: folders first, unless reversed
function renderNodes(node, sizePositions) {
  const entries = sortRows([...node.children.values()], tableSorts.changes, changeColumns, isChangeFolder, n => n.name);
  const limit = 300;
  const rows = entries.slice(0, limit).map(child => renderNode(child, sizePositions));
  if (entries.length > limit) rows.push(el('div', { class: 'more' }, `…and ${entries.length - limit} more`));
  return rows;
}

// Merge chains of folders that only contain one thing, like VS Code's compact folders, including
// when that one thing is the change itself: a single changed file, or a folder added or removed whole
function compact(node) {
  let label = node.name;
  while (!node.change && node.children.size === 1) {
    const [only] = node.children.values();
    node = only;
    label += '/' + node.name;
  }
  return { node, label };
}

// Folders in the changes tree that were opened or closed by hand, so re-rendering keeps them that way
const changeFolders = new Map();

function renderNode(original, sizePositions, whole = false) {
  // The top folder stays as itself, rather than merging into a folder it only contains
  const { node, label } = whole ? { node: original, label: original.name } : compact(original);
  const change = node.change;
  const isFolder = node.children.size > 0 || change?.d;
  const kind = change?.k;
  // A folder where only dates changed, like settings a game rewrote unchanged, is grouped like one added or
  // removed whole: a dot, collapsed (except the top folder), with how many on hover
  const datesOnly = !change && node.counts.d > 0 && !node.counts['+'] && !node.counts['-'] && !node.counts['~'] && !node.counts['*'];
  const symClass = KIND_CLASS[datesOnly ? 'd' : kind];
  const wrapper = el('div');
  let open = node.children.size > 0 &&
    // Folders start open, except ones added or removed whole, or with only dates changed, whose row says enough
    (changeFolders.has(node.path) ? changeFolders.get(node.path) : !change && !(datesOnly && !whole));
  const childBox = el('div', { class: 'children' });

  const fill = () => childBox.replaceChildren(...renderTree(node, sizePositions));
  const twisty = node.children.size
    ? el('button', { class: 'twisty', 'aria-expanded': String(open), 'aria-label': `${open ? 'Collapse' : 'Expand'} ${node.name}`,
        onclick: () => {
          open = !open;
          changeFolders.set(node.path, open);
          twisty.textContent = open ? '▾' : '▸';
          twisty.setAttribute('aria-expanded', String(open));
          childBox.hidden = !open;
          if (open && !childBox.childElementCount) fill();
        } },
      open ? '▾' : '▸')
    : el('span');

  // The same columns for every row: files added, removed and modified (for folders; a file's symbol says
  // which it is), its size, and how much bigger or smaller it got
  const count = k => el('span', { class: KIND_CLASS[k] },
    isFolder && node.counts[k] ? node.counts[k].toLocaleString('en-GB') : '');
  const delta = isFolder ? node.delta : changeDelta(change);
  const deltaCell = delta
    ? el('span', { class: 'delta', style: `color:${textColour(changeRgb(delta, sizePositions))}` }, signedSize(delta))
    // Files that changed without changing size, including just their dates, changed by nothing
    : el('span', { class: 'delta muted' }, change && !isFolder && (kind === '~' || kind === 'd') ? '0 B' : '');

  // In a merged row, the folders leading to what's named are dimmed
  const cut = label.lastIndexOf('/') + 1;
  // Like Contents: a single click shows its snapshots, a double click opens the folder or the file's page
  const inside = [state.scope, node.path].filter(Boolean).join('/');
  const goInto = () => isFolder
    ? navigate({ scope: inside })
    : navigate({ scope: inside.includes('/') ? inside.slice(0, inside.lastIndexOf('/')) : '', file: inside.slice(inside.lastIndexOf('/') + 1) });
  const name = el('button', {
    class: 'name', title: 'Click for its snapshots · double-click to open',
    onclick: event => { if (event.detail === 1) openHistory(node.path, !!isFolder); },
    ondblclick: node.path ? goInto : null,
  }, cut ? el('span', { class: 'muted' }, label.slice(0, cut)) : null, label.slice(cut) + (isFolder ? '/' : ''));
  // Things that only existed in between, and folders with nothing else in them, are greyed out with no symbol;
  // files whose modified date changed but not their contents get a small dot
  const transient = kind === '*' || (!change && node.counts['*'] > 0 &&
    !node.counts['+'] && !node.counts['-'] && !node.counts['~'] && !node.counts.d);
  const rowTitle = kind === 'd' ? `Only its modified date changed, from ${formatFull(change.from)} to ${formatFull(change.to)}`
    : datesOnly ? `${plural(node.counts.d, 'file')} in here only had their modified dates change`
    : transient ? 'Only existed in between' : null;
  // Folders that only contain changes have no symbol or size of their own
  wrapper.append(el('div', { class: `node${isFolder ? ' folder' : ''}${transient ? ' transient' : ''}${kind === 'd' || datesOnly ? ' date-only' : ''}`, title: rowTitle },
    twisty, el('span', { class: `sym ${symClass || ''}` }, kind === '-' ? '−' : kind === 'd' || datesOnly ? '•' : kind === '*' ? '' : kind || ''), name,
    count('+'), count('-'), count('~'),
    el('span', { class: 'size' }, change ? formatSize(change.s) : ''), deltaCell));
  if (node.children.size) {
    childBox.hidden = !open;
    if (open) fill();
    wrapper.append(childBox);
  }
  return wrapper;
}

/* ---------- History ---------- */

/* ---------- Snapshots panel: the location's snapshots, as the history of a folder or file ---------- */

// Whether the path picked for the panel is a folder, when it was picked by clicking something that knows
let pickedIsFolder = true;

// Picking a path inside the folder in scope shows its snapshots in the panel, without moving
function openHistory(relativePath, isFolder = true) {
  pickedIsFolder = isFolder;
  navigate({ history: pathInScope(storage.find(l => l.path === state.location), relativePath) });
}

// The deepest backup location containing a path
function locationOf(path) {
  const lower = path.replace(/\\$/, '').toLowerCase();
  return storage
    .filter(l => lower === l.path.replace(/\\$/, '').toLowerCase() || lower.startsWith(l.path.replace(/\\$/, '').toLowerCase() + '\\'))
    .sort((a, b) => b.path.length - a.path.length)[0];
}

// The path's place in a location, with / separators: '' for the location itself
function relativeTo(loc, path) {
  const base = loc.path.replace(/\\$/, '');
  return path.length > base.length ? path.slice(base.length + 1).replaceAll('\\', '/') : '';
}

// A folder path inside a location with each name in its real case, taken from the latest snapshot,
// as paths are typed in any case on Windows but kopia's names are case-sensitive
function realCase(loc, rel) {
  const snap = sidebarSnapshot(loc);
  const parts = [];
  for (const part of rel ? rel.split('/') : []) {
    const entries = snap && snapshotListing(snap, parts.join('/'));
    const match = entries?.find(e => e.n.toLowerCase() === part.toLowerCase());
    parts.push(match ? match.n : part);
  }
  return parts.join('/');
}

// Go to a typed path: into its folder in the location that contains it, or a folder page above locations
function goToPath(typed) {
  // Paths can be typed with forward slashes or doubled ones, and a drive on its own, like A:
  let path = typed.trim().replaceAll('/', '\\').replace(/\\{2,}/g, '\\').replace(/\\$/, '');
  if (/^[a-z]:$/i.test(path)) path += '\\';
  const loc = locationOf(path);
  if (loc) {
    // A file opens its own page in the folder it's in; anything else is taken as a folder
    const rel = realCase(loc, relativeTo(loc, path));
    const parent = rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';
    const name = rel.slice(rel.lastIndexOf('/') + 1);
    const entry = rel && snapshotListing(asOfSnapshot(loc), parent)?.find(e => e.n.toLowerCase() === name.toLowerCase());
    if (entry?.t === 'f') return navigate({ location: loc.path, snapshot: null, scope: parent, file: entry.n });
    return navigate({ location: loc.path, snapshot: null, scope: rel });
  }
  const node = treeNodes.get(path.toLowerCase()) || treeNodes.get(`${path}\\`.toLowerCase());
  if (node) return navigate(node.location ? { location: node.location.path, snapshot: null } : { folder: node.path });
  const input = document.getElementById('search-input');
  input.setCustomValidity(`${path} isn't in any backup location`);
  input.reportValidity();
  input.addEventListener('input', () => input.setCustomValidity(''), { once: true });
}

// How a path changed from one snapshot to the next: { identical } when the snapshots are the same,
// otherwise { kind, size, oldSize, files } for a file or a folder added or removed whole, and, for a folder,
// counts of the files changed inside it. null if that diff wasn't captured.
// kopia's diff only reports changes to contents, so with none, touched says whether the path itself still
// differs, as a file's modified date changing without its contents (git does this) makes kopia store it, and
// every folder above it, again. Otherwise the snapshot differs only because of something elsewhere.
function stepChange(older, newer, rel, isFolder) {
  if (older.root === newer.root) return { identical: true };
  const list = api.diff(older.id, newer.id);
  if (!list) return null;
  const result = { counts: { '+': 0, '-': 0, '~': 0 } };
  for (const change of list) {
    if (!isFolder) {
      if (change.p === rel) Object.assign(result, { kind: change.k, size: change.s, oldSize: change.o });
    } else if (rel && change.p === `${rel}/`) {
      Object.assign(result, { kind: change.k, size: change.s, files: change.f });
    } else if ((!rel || change.p.startsWith(`${rel}/`)) && !change.p.endsWith('/')) {
      result.counts[change.k]++;
    }
  }
  if (!changedAtAll(result)) {
    // A folder by the object kopia stored for it, a file by its modified date, from the listing it's in
    const parent = rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';
    const name = rel.slice(rel.lastIndexOf('/') + 1);
    const entry = snap => snapshotListing(snap, parent)?.find(e => e.n === name && e.t === (isFolder ? 'd' : 'f'));
    const marker = snap => (!rel ? snap.root : isFolder ? entry(snap)?.o : entry(snap)?.m);
    const [before, after] = [marker(older), marker(newer)];
    if (before !== undefined && after !== undefined) result.touched = before !== after;
  }
  return result;
}

const changedAtAll = change => !!change && !change.identical &&
  (!!change.kind || change.counts['+'] + change.counts['-'] + change.counts['~'] > 0);

// What a step did to the path, as a line under the snapshot
function describeStep(change, isFolder) {
  if (change === 'first') return el('span', { class: 'muted' }, 'Oldest snapshot');
  if (change === null) return el('span', { class: 'muted' }, !LIVE ? 'Changes not captured in the mockup' : pending.size ? 'Loading changes…' : 'Changes couldn\'t be loaded (see the bottom of the page)');
  // Nothing changed in it, whether or not anything did elsewhere in the location, which hovering says
  if (change.identical) return el('span', { class: 'muted', title: 'The whole snapshot is identical to the one before' }, 'No changes');
  const kinds = { '+': ['c-added', 'Added'], '-': ['c-removed', 'Removed'], '~': ['c-modified', 'Modified'] };
  if (change.kind && (change.kind !== '~' || !isFolder)) {
    const [cls, word] = kinds[change.kind];
    const delta = change.kind === '~' && change.oldSize != null && change.size !== change.oldSize ? ` (${signedSize(change.size - change.oldSize)})` : '';
    const what = change.kind === '-' ? '' : ` · ${formatSize(change.size)}${delta}${isFolder && change.files != null ? ` in ${plural(change.files, 'file')}` : ''}`;
    return el('span', {}, el('span', { class: cls }, word), what);
  }
  if (!changedAtAll(change)) {
    // Until the listings to compare are in, it isn't known which; if they can't be, all that's known is the diff's
    if (change.touched === undefined) return el('span', { class: 'muted' }, LIVE && pending.size ? 'Checking…' : 'No content changes');
    return change.touched
      ? el('span', { class: 'muted', title: 'kopia stored it again because a modified date changed, but no file\'s contents did' },
        isFolder ? 'Only modified dates changed' : 'Only its modified date changed')
      : el('span', { class: 'muted', title: 'Nothing in it changed; something elsewhere in the location did' }, 'No changes');
  }
  // Only the kinds of change that happened, to keep the panel quiet
  return el('span', { class: 'counts', style: 'font-size:inherit;gap:8px' },
    ['+', '-', '~'].filter(k => change.counts[k]).map(k =>
      el('span', { class: kinds[k][0] }, `${k === '-' ? '−' : k}${change.counts[k].toLocaleString('en-GB')}`)));
}

// Whether the picked path is a folder: known if it was clicked, otherwise looked up in the snapshot
function isFolderPath(loc, rel) {
  if (!rel) return true;
  if (state.history && !state.file) return pickedIsFolder;
  if (state.file && !state.history) return false;
  const parent = rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';
  const snap = sidebarSnapshot(loc);
  const entry = snap && snapshotListing(snap, parent)?.find(e => e.n === rel.slice(rel.lastIndexOf('/') + 1));
  return entry ? entry.t === 'd' : true;
}

// Why kopia's retention policy keeps a snapshot, from its reasons like latest-1, daily-3 or annual-1. The one
// that keeps it longest decides how long it stays, so that's shown, with all of them on hover.
const KEEP_KINDS = [['annual', 'yearly'], ['monthly', 'monthly'], ['weekly', 'weekly'], ['daily', 'daily'], ['hourly', 'hourly'], ['latest', 'as recent']];
function keptFor(snap) {
  if (!snap.keep?.length) return null;
  const reasons = snap.keep.map(r => r.split('-'));
  const [kind, word] = KEEP_KINDS.find(([k]) => reasons.some(([r]) => r === k)) || [];
  if (!kind) return null;
  const named = Object.fromEntries(KEEP_KINDS);
  const all = reasons.map(([r, n]) => `${r === 'latest' ? 'one of the latest' : named[r] || r} #${n}`).join(', ');
  return el('span', { class: 'keep', title: `Kept by kopia's retention policy as ${all}. ${kind === 'latest'
    ? 'Only as one of the latest, so it goes when newer snapshots replace it.' : `The ${word} one keeps it longest.`}` }, `kept ${word}`);
}

// For the PC or a folder above the backup locations, which have no snapshots of their own: the locations
// inside, each with its latest snapshot, so it's clear at a glance which are being backed up
function renderFolderSide(aside) {
  const node = treeNodes.get(state.folder.toLowerCase());
  const locations = node ? locationsBelow(node).sort((a, b) => a.path.localeCompare(b.path, 'en', { sensitivity: 'base' })) : [];
  aside.replaceChildren(
    el('div', { class: 'history-head' },
      el('div', {}, el('h2', {}, `Backup locations (${locations.length})`), el('div', { class: 'target' }, state.folder))),
    el('ul', { class: 'snaps' }, locations.map(loc => {
      // The snapshot for the as-of date, or with none set, the latest; and what was on disk by then
      const newest = state.asOf ? (tooOld(loc) ? null : asOfSnapshot(loc)) : latest(loc);
      const onDisk = state.asOf ? newest?.total ?? 0 : locationTotal(loc);
      const cut = loc.path.lastIndexOf('\\') + 1;
      return el('li', { class: 'snaprow', title: `Open ${loc.path}`, onclick: () => navigate({ location: loc.path, snapshot: null }) },
        el('div', { class: 'top' },
          el('span', { class: 'marker', style: 'color:var(--accent)' }, '●'),
          // The path leading to the location gives way first, so its own name stays readable
          el('span', { class: 'when mono churn-name' },
            el('span', { class: 'lead' }, loc.path.slice(node.root ? 0 : state.folder.replace(/\\$/, '').length + 1, cut)),
            el('span', { class: 'own' }, `${loc.path.slice(cut)}\\`)),
          backingUpNow(loc) ? el('span', { class: 'badge' }, 'Live') : null,
          newest ? el('span', { class: 'disk', title: state.asOf ? 'On disk as of this snapshot' : 'On disk' }, diskText(onDisk)) : null),
        el('div', { class: 'what' },
          newest ? el('span', {}, `${state.asOf ? 'Snapshot' : 'Latest'} ${formatFull(newest.time)}`)
            : el('span', { class: 'muted' }, state.asOf ? 'No snapshot that old' : 'No snapshots'),
          newest ? el('span', { class: 'ago' }, timeAgo(newest.time)) : null));
    })));
}

function renderSide() {
  const aside = document.getElementById('history');
  const app = document.getElementById('app');
  const target = state.history || currentPath();
  const loc = target && locationOf(target);
  // The panel stays open everywhere, so the page keeps its shape
  const shown = !!loc || !!state.folder;
  aside.hidden = !shown;
  app.classList.toggle('with-history', shown);
  if (!shown) return;
  if (!loc) return renderFolderSide(aside);

  const rel = relativeTo(loc, target);
  const isFolder = isFolderPath(loc, rel);
  // Snapshots can be viewed and compared for the location open in the middle; elsewhere a click goes there
  const viewing = loc.path === state.location;
  const selected = viewing ? selectedSnapshot(loc) : null;
  // The comparison is the changes panel's, for the folder being looked at, so it's only marked when
  // this list is for that folder, not for an item picked in it or a file's own page
  const other = viewing && !state.history && !state.file ? compareTarget(loc, selected) : null;
  const complete = loc.snapshots.filter(s => !s.incomplete);
  const inProgress = loc.snapshots.filter(s => s.incomplete);
  const [low, high] = other ? [complete.indexOf(other), complete.indexOf(selected)].sort((a, b) => a - b) : [-1, -1];
  const positions = gradientPositions(loc.snapshots.map(s => s.onDisk).filter(Boolean));
  const parentRel = rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';

  // The size of what the panel is for at a snapshot: the snapshot's own for the location, otherwise from the
  // listing of the folder it's in, loaded if need be. Nothing if it isn't in that snapshot.
  const sizeAt = snap => {
    if (snap.incomplete) return null;
    const name = rel.slice(rel.lastIndexOf('/') + 1);
    const entries = rel ? snapshotListing(snap, parentRel) : undefined;
    const size = !rel ? snap.size : entries?.find(e => e.n === name)?.s;
    if (size == null) return rel && entries === undefined && LIVE ? el('span', { class: 'disk muted' }, '…') : null;
    return el('span', { class: 'disk', title: `Size of ${rel ? name : 'the location'} in this snapshot` }, formatSize(size));
  };

  const row = (snap, change, extraClass = '') => {
    const at = complete.indexOf(snap);
    const deleting = beingDeleted(snap);
    const classes = ['snaprow', extraClass, deleting ? 'deleting' : '',
      snap === selected ? 'viewing' : '', snap === other ? 'compared' : '',
      // Taken after the as-of date
      state.asOf && new Date(snap.time) > new Date(state.asOf) ? 'after' : '',
      at > low && at < high ? 'between' : '', change !== 'first' && change && !change.kind && !changedAtAll(change) ? 'unchanged' : ''];
    // A file's snapshot opens the file itself at that time, and a folder's opens that folder; for the
    // folder already open it's viewed in place
    const here = isFolder && viewing && !state.file && rel === state.scope;
    const open = () => !isFolder
      ? navigate({ location: loc.path, scope: parentRel, file: rel.slice(rel.lastIndexOf('/') + 1), asOf: asOfFor(loc, snap) })
      : here
        ? pickSnapshot(snap, selected, false)
        : navigate({ location: loc.path, asOf: asOfFor(loc, snap), scope: rel, file: null, history: null });
    return el('li', {
      class: classes.filter(Boolean).join(' '),
      title: deleting ? 'This snapshot is being deleted' : snap.incomplete ? `This snapshot ${unfinished(snap)}`
        : here ? 'Click to view · Shift-click to compare with it' : 'Click to open at this snapshot',
      onclick: snap.incomplete || deleting ? null : event => (here && event.shiftKey ? pickSnapshot(snap, selected, true) : open()),
    },
      el('div', { class: 'top' },
        el('span', { class: 'marker' }, snap === selected ? '●' : snap === other ? '○' : ''),
        el('span', { class: 'when' }, formatFull(snap.time)),
        snap === latest(loc) ? el('span', { class: 'tag' }, 'latest') : null,
        snap === other ? el('span', { class: 'tag' }, 'compared') : null,
        snap.incomplete ? el('span', { class: 'badge' }, isCancelled(snap) ? 'Cancelled' : 'In progress') : null,
        deleting ? el('span', { class: 'badge' }, 'Deleting…') : null,
        sizeAt(snap),
        // Space the snapshot added on disk is for the whole location, so it's only shown for the location
        // itself; for anything inside, the row's own change says what happened to it
        // A snapshot just made doesn't have it yet, until the snapshots are read again
        rel ? null : snap.onDisk == null
          ? el('span', { class: 'disk muted', title: 'Working out how much this snapshot added on disk…' }, '…')
          : el('span', { class: 'disk', title: 'Added on disk by this snapshot, for the whole location' },
            snap.onDisk ? el('span', { class: 'swatch', style: `background:${fillColour(gradientRgb(positions.get(snap.onDisk)))}` }) : null,
            `+${formatSize(snap.onDisk)}`),
        // Not one still being made, which kopia replaces as it goes
        LIVE && !deleting && (!snap.incomplete || isCancelled(snap)) ? el('button', {
          class: 'delete', 'aria-label': 'Delete this snapshot', title: 'Delete this snapshot…',
          onclick: event => { event.stopPropagation(); confirmDelete(loc, snap, rel, isFolder); },
        }, '×') : null),
      el('div', { class: 'what' },
        snap.incomplete ? el('span', { class: 'muted' }, 'Stored so far') : describeStep(change, isFolder),
        keptFor(snap),
        el('span', { class: 'ago' }, timeAgo(snap.time))));
  };

  // Newest first, each with what it changed in the path since the one before
  const rows = [];
  for (let i = complete.length - 1; i >= 0; i--) {
    rows.push(row(complete[i], i === 0 ? 'first' : stepChange(complete[i - 1], complete[i], rel, isFolder)));
  }

  // The same path may be backed up by other locations too
  const elsewhere = storage.filter(l => l !== loc && locationOf(target) !== l &&
    (target.toLowerCase() + '\\').startsWith(l.path.replace(/\\$/, '').toLowerCase() + '\\'));

  aside.replaceChildren(...[
    el('div', { class: 'history-head' },
      el('div', {}, el('h2', {}, `Snapshots (${complete.length})`), el('div', { class: 'target' }, target)),
      // Up one folder level within the location, for the panel only; the middle stays where it is
      rel ? el('button', {
        class: 'btn', style: 'font-size:0.8rem;flex:none', title: 'Show the snapshots of the folder above',
        onclick: () => {
          const above = target.slice(0, target.lastIndexOf('\\'));
          pickedIsFolder = true;
          navigate({ history: above.toLowerCase() === currentPath().toLowerCase() ? null : above });
        },
      }, '↑ Up') : null,
      backupButton(loc)),
    el('ul', { class: 'snaps' }, inProgress.map(s => row(s, null, 'partial')), rows),
    elsewhere.length ? el('div', { class: 'elsewhere' }, 'Also backed up in ',
      elsewhere.map((l, i) => [i ? ', ' : '', el('button', {
        onclick: () => navigate({ location: l.path, snapshot: null, scope: isFolder ? relativeTo(l, target) : relativeTo(l, target).split('/').slice(0, -1).join('/') }),
      }, l.path)])) : null,
  ].filter(Boolean));
}

/* ---------- One box: filter the sidebar, or go to a path ---------- */

// Something with a drive letter or slashes is a path to go to; anything else filters
const looksLikePath = text => /^[a-z]:/i.test(text) || /[\\/]/.test(text);
let sidebarFilter = '';

// Matches for a filter: backup locations by path, then folders and files by name from each location's
// snapshot for the as-of date, as far as their listings are known
function findMatches(query) {
  const q = query.toLowerCase();
  const results = new Map();
  for (const loc of storage) {
