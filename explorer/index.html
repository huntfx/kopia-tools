    if (loc.path.toLowerCase().includes(q)) results.set(loc.path.toLowerCase(), { kind: 'location', loc, path: loc.path, name: loc.path });
  }
  for (const loc of storage) {
    const snap = asOfSnapshot(loc);
    if (!snap || snap.incomplete) continue;
    const base = loc.path.replace(/\\$/, '');
    const walk = rel => {
      // Only what's loaded already, as loading everything to search it would crawl the whole repository
      for (const entry of snapshotListing(snap, rel, false) || []) {
        const inside = joinRel(rel, entry.n);
        const path = `${base}\\${inside.replaceAll('/', '\\')}`;
        if (entry.n.toLowerCase().includes(q) && !results.has(path.toLowerCase())) {
          results.set(path.toLowerCase(), { kind: entry.t === 'd' ? 'folder' : 'file', loc, rel: inside, path, name: entry.n, size: entry.s });
        }
        if (entry.t === 'd') walk(inside);
      }
    };
    walk('');
  }
  // Locations, then folders, then files, each by path
  const order = { location: 0, folder: 1, file: 2 };
  return [...results.values()].sort((a, b) => order[a.kind] - order[b.kind] || a.path.localeCompare(b.path, 'en', { sensitivity: 'base' }));
}

function openMatch(match) {
  if (match.kind === 'location') return navigate({ location: match.loc.path, snapshot: null });
  const parent = match.rel.includes('/') ? match.rel.slice(0, match.rel.lastIndexOf('/')) : '';
  if (match.kind === 'folder') return navigate({ location: match.loc.path, snapshot: null, scope: match.rel });
  return navigate({ location: match.loc.path, snapshot: null, scope: parent, file: match.name });
}

// The text with the part matching the filter marked
function highlight(text, query) {
  const at = text.toLowerCase().lastIndexOf(query.toLowerCase());
  if (at < 0) return [text];
  return [text.slice(0, at), el('mark', {}, text.slice(at, at + query.length)), text.slice(at + query.length)];
}

// The sidebar while filtering: a flat list of matches instead of the tree
function renderMatches() {
  const matches = findMatches(sidebarFilter);
  const limit = 100;
  document.getElementById('sum').replaceChildren(
    `${matches.length.toLocaleString('en-GB')} ${matches.length === 1 ? 'match' : 'matches'} for `, el('b', {}, `“${sidebarFilter}”`), ' · ',
    el('button', { class: 'linklike', onclick: () => clearFilter() }, 'Clear'));
  document.getElementById('locations').replaceChildren(...matches.slice(0, limit).map(match => {
    const cut = match.path.replace(/\\$/, '').lastIndexOf('\\') + 1;
    const own = match.kind === 'location' ? match.path.slice(cut) || match.path : match.name;
    return el('div', { class: `fsrow${match.kind === 'location' ? '' : ' group'}`, style: 'padding-left:6px' },
      el('span'),
      el('button', { class: 'label', title: match.path, onclick: () => { clearFilter(); openMatch(match); } },
        match.kind === 'location' ? el('span', { class: 'dot', 'aria-hidden': 'true' }) : null,
        cut ? el('span', { class: 'prefix' }, match.kind === 'location' ? highlight(match.path.slice(0, cut), sidebarFilter) : match.path.slice(0, cut)) : null,
        el('span', { class: 'text' }, highlight(own + (match.kind !== 'file' && !own.endsWith('\\') ? '\\' : ''), sidebarFilter))),
      el('span', { class: 'total muted' }, match.kind === 'location' ? diskText(locationTotal(match.loc)) : formatSize(match.size)));
  }), ...(matches.length > limit ? [el('div', { class: 'more', style: 'padding:4px 16px' }, `…and ${matches.length - limit} more`)] : []),
  ...(matches.length ? [] : [el('p', { class: 'note', style: 'padding:0 16px' }, 'Nothing matches. Paste a full path to go straight to it.')]));
}

function clearFilter() {
  sidebarFilter = '';
  document.getElementById('search-input').value = '';
  renderLocations();
}

const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', () => {
  const text = searchInput.value.trim();
  sidebarFilter = looksLikePath(text) ? '' : text;
  renderLocations();
});
searchInput.addEventListener('keydown', event => { if (event.key === 'Escape') clearFilter(); });
document.getElementById('search').addEventListener('submit', event => {
  event.preventDefault();
  const text = searchInput.value.trim().replace(/[\\/]+$/, '');
  if (!text) return;
  if (looksLikePath(text)) {
    goToPath(text);
    return;
  }
  // Words open the first match
  const [first] = findMatches(text);
  if (first) {
    clearFilter();
    openMatch(first);
  }
});

/* ---------- Render ---------- */

/* ---------- Files as of a date ---------- */

// The input works in local time, as "2026-10-26T12:00", while the state keeps an ISO date
const toLocalInput = iso => {
  const date = new Date(iso);
  return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
};

// A time, like Google's time pickers: "now", "today", "yesterday", an amount ago such as 15m, 3h, 2d, 1w,
// 1mo or 1y, or a date. A Date, or null if it can't be read.
const AGO_UNITS = { s: 1, m: 60, min: 60, h: 3600, d: 86400, w: 604800, mo: 2629800, y: 31557600 };
function parseWhen(text) {
  const t = text.trim().toLowerCase();
  const midnight = days => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - days); return d; };
  if (t === 'now') return new Date();
  if (t === 'today') return midnight(0);
  if (t === 'yesterday') return midnight(1);
  const ago = t.match(/^(\d+(?:\.\d+)?)\s*(s|min|mo|m|h|d|w|y)$/);
  if (ago) return new Date(Date.now() - Number(ago[1]) * AGO_UNITS[ago[2]] * 1000);
  // Dates as typed, like 2026-10-20 12:00, in local time
  const date = new Date(/^\d{4}-\d\d-\d\d \d/.test(t) ? t.replace(' ', 'T') : text);
  return isNaN(date) ? null : date;
}

// The menu's choices, in groups, each with its shorthand
const AS_OF_CHOICES = [
  [['Now', 'now']],
  [['Start of today', 'today'], ['Start of yesterday', 'yesterday']],
  [['15 minutes ago', '15m'], ['1 hour ago', '1h'], ['3 hours ago', '3h'], ['6 hours ago', '6h'], ['12 hours ago', '12h']],
  [['1 day ago', '1d'], ['2 days ago', '2d'], ['1 week ago', '1w'], ['2 weeks ago', '2w']],
  [['1 month ago', '1mo'], ['3 months ago', '3mo'], ['6 months ago', '6mo'], ['1 year ago', '1y']],
];

const asOfMenu = document.getElementById('as-of-menu');
const asOfButton = document.getElementById('as-of-button');
const asOfText = document.getElementById('as-of-text');
const asOfError = document.getElementById('as-of-error');
const asOfInput = document.getElementById('as-of-input');

// A time within the last couple of minutes, or later, is the same as now, so it keeps following the latest
function applyWhen(date) {
  closeAsOfMenu();
  navigate({ asOf: date < new Date(Date.now() - 120000) ? date.toISOString() : null });
}

function openAsOfMenu() {
  asOfMenu.hidden = false;
  asOfButton.setAttribute('aria-expanded', 'true');
  asOfText.value = '';
  asOfError.hidden = true;
  asOfInput.value = toLocalInput(state.asOf || new Date().toISOString());
  document.getElementById('as-of-list').replaceChildren(...AS_OF_CHOICES.flatMap((group, i) => [
    i ? el('li', { class: 'gap', role: 'separator' }) : null,
    ...group.map(([label, short]) => el('li', {},
      el('button', { type: 'button', 'aria-current': String(short === 'now' && !state.asOf), onclick: () => applyWhen(parseWhen(short)) },
        el('span', {}, label), el('span', { class: 'short' }, short))))
  ].filter(Boolean)));
  asOfText.focus();
}
function closeAsOfMenu() {
  asOfMenu.hidden = true;
  asOfButton.setAttribute('aria-expanded', 'false');
}
asOfButton.addEventListener('click', () => (asOfMenu.hidden ? openAsOfMenu() : closeAsOfMenu()));
document.addEventListener('mousedown', event => {
  if (!asOfMenu.hidden && !document.getElementById('as-of').contains(event.target)) closeAsOfMenu();
});
asOfMenu.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  closeAsOfMenu();
  asOfButton.focus();
});
document.getElementById('as-of-typed').addEventListener('submit', event => {
  event.preventDefault();
  const date = parseWhen(asOfText.value);
  if (date) return applyWhen(date);
  asOfError.textContent = 'Try something like 15m, 3h, 2d, 1w, today, or 2026-10-20 12:00';
  asOfError.hidden = false;
});
document.getElementById('as-of-custom').addEventListener('submit', event => {
  event.preventDefault();
  if (asOfInput.value) applyWhen(new Date(asOfInput.value));
});

// The snapshots to step through with ‹ and ›: the location being viewed's, or on a folder page, every
// location's inside it. The current one is the one viewed, or for a folder page, the latest as of the date.
function asOfSteps() {
  const loc = storage.find(l => l.path === state.location);
  if (loc) {
    const complete = loc.snapshots.filter(s => !s.incomplete);
    const current = selectedSnapshot(loc);
    const at = complete.indexOf(current.incomplete ? complete[complete.length - 1] : current);
    const asOf = snap => asOfFor(loc, snap);
    return { older: at > 0 ? asOf(complete[at - 1]) : undefined, newer: at >= 0 && at < complete.length - 1 ? asOf(complete[at + 1]) : undefined };
  }
  const node = state.folder && treeNodes.get(state.folder.toLowerCase());
  const times = [...new Set((node ? locationsBelow(node) : storage).flatMap(l => l.snapshots.filter(s => !s.incomplete).map(s => s.time)))]
    .sort((a, b) => new Date(a) - new Date(b));
  const limit = state.asOf ? new Date(state.asOf) : new Date();
  const at = times.findLastIndex(t => new Date(t) <= limit);
  return {
    older: at > 0 ? times[at - 1] : undefined,
    // Stepping onto the newest is the same as now
    newer: at >= 0 && at < times.length - 1 ? (at + 1 === times.length - 1 ? null : times[at + 1]) : undefined,
  };
}

function renderAsOf() {
  const box = document.getElementById('as-of');
  box.classList.toggle('set', !!state.asOf);
  document.getElementById('as-of-label').textContent = state.asOf ? `${formatFull(state.asOf)} · ${timeAgo(state.asOf)}` : 'Now';
  const { older, newer } = asOfSteps();
  const step = (id, target, which) => {
    const button = document.getElementById(id);
    button.disabled = target === undefined;
    button.title = target === undefined ? `No snapshot ${which}` : `Snapshot ${which}: ${target ? formatFull(target) : 'the latest'}`;
    button.onclick = () => navigate({ asOf: target });
  };
  step('as-of-older', older, 'before');
  step('as-of-newer', newer, 'after');
}
setInterval(() => { if (state.asOf) renderAsOf(); }, 15000);

function render() {
  if (!state.location && !state.folder && storage.length) state.location = storage.find(l => l.path === 'C:\\Users\\Peter')?.path || storage[0].path;
  renderAsOf();
  renderLocations();
  renderMain();
  renderSide();
}

// Copying a path from the breadcrumbs gives it on one line, as it's shown: its parts are separate elements,
// which would otherwise copy as a line each
document.addEventListener('copy', event => {
  const selection = document.getSelection();
  const crumbsOf = node => (node?.nodeType === Node.TEXT_NODE ? node.parentElement : node)?.closest('.crumbs');
  if (!selection.rangeCount || !crumbsOf(selection.anchorNode)) return;
  event.clipboardData.setData('text/plain', selection.toString().replace(/\s*\n\s*/g, ''));
  event.preventDefault();
});

followStorage();
document.getElementById('captured').title = repositoryTitle();
readHash();
reveal(currentFolder());
renderSort();
render();
writeHash(true);
</script>
