<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kopia Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Kopia Explorer</h1>
  <span class="repo-status" id="repo-status"></span>
  <button type="button" class="refresh" id="refresh" aria-label="Refresh" title="Read the snapshots and schedules again now - Shift+click for a hard refresh, reading everything from Kopia again, as when the explorer starts, apart from diffs, listings and file types, which never change for a snapshot">
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12.5 1.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="as-of" id="as-of" role="group" aria-label="Show files as of a date">
    <button type="button" id="as-of-older" aria-label="Snapshot before">‹</button>
    <button type="button" id="as-of-button" class="when-button" aria-haspopup="dialog" aria-expanded="false" title="Show files as of another date">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5V8l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="muted">Files as of</span> <span id="as-of-label"></span> <span aria-hidden="true">▾</span>
    </button>
    <button type="button" id="as-of-newer" aria-label="Snapshot after">›</button>
    <div class="as-of-menu" id="as-of-menu" role="dialog" aria-label="Files as of" hidden>
      <form class="typed" id="as-of-typed">
        <input id="as-of-text" autocomplete="off" placeholder="Time ago (15m, 1h, 1d, 1w) or a date" aria-label="Time ago, or a date">
        <p class="error" id="as-of-error" hidden></p>
      </form>
      <ul id="as-of-list"></ul>
      <form class="custom" id="as-of-custom">
        <input type="datetime-local" id="as-of-input" aria-label="Date and time">
        <button type="submit">Go</button>
      </form>
      <label class="include-oldest">
        <input type="checkbox" id="as-of-include-oldest"> Include oldest snapshot, even if it's after this date
      </label>
    </div>
  </div>
  <button type="button" class="btn icon-button" id="mounts-button" aria-label="Mounts" title="Mounts: every folder from a snapshot mounted as a drive">
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="4.5" width="13" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="11.5" cy="8" r="1" fill="currentColor"/></svg>
    <span class="count" id="mounts-count"></span>
  </button>
  <button type="button" class="btn icon-button" id="fixes-button" aria-label="Fixes" title="Fixes: every location with the parent settings fix or the last good pin, or needing one">
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8.7 1.6l5.7 5.7-2.1 2.1-5.7-5.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M2.5 13.5l6.9-6.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <button type="button" class="btn icon-button" id="settings-button" aria-label="Settings" title="Settings">
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><path d="M8 1v2.5M8 12.5V15M1 8h2.5M12.5 8H15M3.05 3.05l1.75 1.75M11.2 11.2l1.75 1.75M3.05 12.95l1.75-1.75M11.2 4.8l1.75-1.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
</header>

<div class="app" id="app">
  <nav class="sidebar" aria-label="Backup locations">
    <div class="sidebar-head">
      <h2>Backup locations</h2>
      <button type="button" class="btn" id="add-location" title="Pick a folder to back up">Add location…</button>
    </div>
    <form class="search" id="search">
      <input id="search-input" placeholder="Filter, or paste a path" aria-label="Filter the backup locations, or a path to go to" autocomplete="off"
        title="Type to filter the locations, folders and files - paste a path like C:\Users\Peter\Documents and press Enter to go there">
    </form>
    <div class="sum" id="sum" hidden></div>
    <div class="sort" id="sort" role="group" aria-label="Show the backup locations as"></div>
    <div class="sort" id="sort-order" role="group" aria-label="Sort the backup locations by" hidden></div>
    <div class="locations" id="locations" role="tree"></div>
  </nav>
  <main class="main" id="main"></main>
  <aside class="history" id="history" hidden></aside>
</div>
<div class="progress" id="progress" role="status" hidden></div>
<!-- Bottom right: warnings about the repository, then the panel following backups, restores and so on -->
<div class="corner">
  <section class="notice" id="notice" role="alert" hidden></section>
  <section class="jobs" id="jobs" aria-label="Backups, restores and deletions" aria-live="polite" hidden></section>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
