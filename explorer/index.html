<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kopia Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: locations on the left, the selected location (timeline, snapshots, changes) in the middle,
   and a history panel on the right when a path is opened. Stacks on narrow screens. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #f9fafb;
  --ink: #12161c;
  --ink-2: #4a5361;
  --muted: #7b8492;
  --line: #e2e6ec;
  --axis: #c5ccd6;
  --accent: #2a78d6;
  --accent-bg: #e8f1fc;
  --warn-bg: #fff6e0;
  --warn-line: #eda100;
  --added: #1a8f5c;
  --removed: #c9372c;
  --modified: #a87400;
  /* Chart series, in a fixed order checked for colour blindness, then grey for everything else */
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-other: #a8a69e;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1b2027; --ink: #eef1f5; --ink-2: #b9c1cc; --muted: #8a93a0;
    --line: #262c35; --axis: #38404b; --accent: #3987e5; --accent-bg: #172638; --warn-bg: #2a2310; --warn-line: #c98500;
    --added: #5ac87e; --removed: #f0675a; --modified: #e6c25a;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-other: #5a5955;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface-2: #1b2027; --ink: #eef1f5; --ink-2: #b9c1cc; --muted: #8a93a0;
  --line: #262c35; --axis: #38404b; --accent: #3987e5; --accent-bg: #172638; --warn-bg: #2a2310; --warn-line: #c98500;
  --added: #5ac87e; --removed: #f0675a; --modified: #e6c25a;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-other: #5a5955;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
}
button, input { font: inherit; color: var(--ink); }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--font-data); font-size: 0.92em; }
.muted { color: var(--muted); }
.num { font-family: var(--font-data); font-size: 0.92em; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
h2 { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; }

/* Header */
.topbar {
  display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: var(--surface);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20;
}
.topbar h1 { font-size: 1.1rem; font-weight: 600; margin: 0; white-space: nowrap; }
.topbar .captured { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
/* Files as of: a button showing the date, between steps to the snapshot before and after, opening a picker */
.as-of { position: relative; display: flex; align-items: stretch; margin-left: auto; font-size: 0.85rem; color: var(--ink-2); white-space: nowrap; }
.as-of > button { background: var(--surface); border: 1px solid var(--axis); padding: 5px 10px; font-size: 0.85rem; color: var(--ink); }
.as-of > button + button { border-left: 0; }
.as-of > button:first-child { border-radius: 6px 0 0 6px; }
.as-of > button:last-of-type { border-radius: 0 6px 6px 0; }
.as-of > button:hover:not(:disabled) { background: var(--surface-2); }
.as-of > button:disabled { color: var(--muted); opacity: 0.5; cursor: default; }
.as-of .when-button { display: flex; align-items: center; gap: 7px; }
.as-of .when-button svg { flex: none; color: var(--accent); }
.as-of .when-button .muted { color: var(--ink-2); }
/* A date in the past is set, so make that obvious */
.as-of.set .when-button { background: var(--warn-bg); border-color: var(--warn-line); }
.as-of.set .when-button svg { color: var(--warn-line); }
.as-of-menu {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; width: 320px; padding: 10px 0 6px;
  background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
  white-space: normal;
}
.as-of-menu[hidden] { display: none; }
.as-of-menu input { width: 100%; background: var(--bg); border: 1px solid var(--axis); border-radius: 6px; padding: 6px 8px; font-size: 0.85rem; color-scheme: inherit; }
.as-of-menu input:focus { border-color: var(--accent); outline: none; }
.as-of-menu .typed { padding: 0 10px 6px; }
.as-of-menu .error { color: var(--removed); font-size: 0.78rem; margin: 4px 2px 0; }
.as-of-menu ul { list-style: none; margin: 0; padding: 0; max-height: 50vh; overflow-y: auto; }
.as-of-menu li.gap { border-top: 1px solid var(--line); margin: 4px 0; }
.as-of-menu li button { display: flex; width: 100%; justify-content: space-between; gap: 12px; background: none; border: 0; padding: 6px 14px; font-size: 0.85rem; text-align: left; }
.as-of-menu li button:hover, .as-of-menu li button:focus-visible { background: var(--surface-2); outline: none; }
.as-of-menu li button[aria-current="true"] { background: var(--accent-bg); color: var(--accent); }
.as-of-menu li .short { color: var(--muted); font-family: var(--font-data); }
.as-of-menu .custom { display: flex; gap: 6px; align-items: center; padding: 8px 10px 2px; border-top: 1px solid var(--line); margin-top: 4px; }
.as-of-menu .custom button { background: var(--accent); border: 1px solid var(--accent); color: #fff; border-radius: 6px; padding: 5px 12px; font-size: 0.85rem; }
/* The filter sits at the top of the backup locations */
.search { display: flex; margin: 0 16px 10px; }
.search input {
  flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--axis); border-radius: 6px; padding: 6px 10px;
  font-family: var(--font-data); font-size: 0.85rem;
}
.btn {
  background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 5px 12px;
}
.btn:hover { border-color: var(--ink-2); }
a.btn { color: inherit; text-decoration: none; display: inline-block; }

.app { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: calc(100vh - 57px); }
.app.with-history { grid-template-columns: 340px minmax(0, 1fr) 460px; }
@media (max-width: 1250px) { .app.with-history { grid-template-columns: 260px minmax(0, 1fr); } }
@media (max-width: 860px) { .app, .app.with-history { grid-template-columns: minmax(0, 1fr); } }

/* Locations */
.sidebar { border-right: 1px solid var(--line); background: var(--surface); padding: 14px 0; min-width: 0; }
.sidebar h2 { padding: 0 16px 8px; }
.sidebar .sum { padding: 0 16px 10px; color: var(--muted); font-size: 0.8rem; }
.sort { display: flex; margin: 0 16px 10px; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
.sort button { flex: 1; background: none; border: 0; padding: 3px 0; font-size: 0.8rem; color: var(--ink-2); }
.sort button + button { border-left: 1px solid var(--axis); }
.sort button[aria-pressed="true"] { background: var(--accent-bg); color: var(--ink); font-weight: 500; }
.locations { font-family: var(--font-data); font-size: 0.8rem; }
.fsrow {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 4px; align-items: center;
  border-left: 3px solid transparent; padding: 3px 12px 3px 0;
}
.fsrow:hover { background: var(--surface-2); }
.fsrow[aria-current="true"] { background: var(--accent-bg); border-left-color: var(--accent); }
.fsrow .twisty { background: none; border: 0; padding: 0; width: 16px; color: var(--muted); }
.fsrow .label {
  background: none; border: 0; padding: 0; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  display: flex; align-items: center; gap: 6px; font-family: inherit;
}
.fsrow .label .text { overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; max-width: 100%; }
/* The leading path gives way first, so the last folder's name stays readable */
.fsrow .label .prefix { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 0; margin-right: -6px; }
.fsrow .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.fsrow.group .label { color: var(--ink-2); }
.fsrow .total { color: var(--ink-2); white-space: nowrap; }
.fsrow.group .total { color: var(--muted); }
.fsrow .badge { margin-left: 2px; }
.fsrow mark { background: var(--warn-bg); color: inherit; border-radius: 2px; box-shadow: 0 0 0 1px var(--warn-line); }
.linklike { background: none; border: 0; padding: 0; color: var(--accent); font-size: inherit; }
.linklike:hover { text-decoration: underline; }
.badge {
  display: inline-block; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 0 6px; border-radius: 4px; background: var(--warn-bg); color: var(--warn-line); border: 1px solid var(--warn-line);
  vertical-align: 1px;
}

/* Main */
.main { padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.loc-head h1 { font-family: var(--font-data); font-size: 1.15rem; font-weight: 500; margin: 0; word-break: break-all; }
.loc-head .meta { color: var(--ink-2); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.loc-head .meta b { font-weight: 600; color: var(--ink); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }

.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.chart-head .legend { color: var(--muted); font-size: 0.8rem; }

/* Where the changes happen: one bar per folder, drilling down on click */
.crumbs { display: flex; flex-wrap: wrap; gap: 2px 4px; font-family: var(--font-data); font-size: 0.82rem; margin-bottom: 8px; color: var(--muted); }
.crumbs button { background: none; border: 0; padding: 0; color: var(--accent); font-family: inherit; }
.crumbs button:hover { text-decoration: underline; }
.crumbs .current { color: var(--ink); }
/* Each row is its own grid, with fixed columns so they line up, and can be highlighted like a table row */
.churn { display: flex; flex-direction: column; margin: 0 -16px; }
.churn-row {
  display: grid; grid-template-columns: minmax(110px, 1.3fr) minmax(50px, 1fr) 70px calc(var(--ticks) * 6px) 150px;
  gap: 12px; align-items: center; padding: 3px 16px; cursor: default;
}
.churn-row:hover { background: var(--surface-2); }
.churn-row.picked { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
.churn-name { display: flex; min-width: 0; font-family: var(--font-data); font-size: 0.82rem; }
.churn-name .own { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 0 auto; max-width: 100%; }
.churn-name .lead { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
.churn-track { display: flex; height: 14px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.churn-fill { height: 100%; border-radius: 3px; min-width: 2px; }
.churn-fill.removed { background: var(--removed); opacity: 0.55; margin-left: 2px; }
.churn .num { font-size: 0.82rem; }
.churn .agg { display: inline-flex; gap: 8px; font-family: var(--font-data); font-size: 0.8rem; white-space: nowrap; justify-content: flex-end; }
/* One tick per snapshot, lit where something changed */
.strip { display: flex; gap: 2px; align-items: center; height: 14px; }
.tick { flex: 1; height: 100%; border-radius: 1px; background: var(--line); cursor: pointer; }
.tick:hover { outline: 1px solid var(--ink-2); }
.tick.added { background: var(--added); }
.tick.removed { background: var(--removed); }
.tick.modified { background: var(--modified); }
.tick.unknown { background: none; border: 1px dashed var(--axis); }
.tick.viewed { box-shadow: 0 0 0 1.5px var(--accent); }

/* Snapshot table */
.table-wrap { overflow-x: auto; margin: 0 -16px -16px; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; }
th { position: sticky; top: 0; background: var(--surface); font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted); text-align: right; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 16px; }
td { padding: 5px 12px; border-bottom: 1px solid var(--line); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.picked { background: var(--accent-bg); }
tbody tr.picked td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
th[aria-sort] { color: var(--ink); }
.sort-head {
  background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit;
  white-space: nowrap;
}
.sort-head:hover { color: var(--ink); }
.tag {
  margin-left: 8px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--ink-2); border: 1px solid var(--axis); border-radius: 4px; padding: 0 5px; vertical-align: 1px;
  white-space: nowrap;
}
.swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }

/* Changes */
/* The changes controls: comparison, counts, filters and the text box on one line, wrapping when narrow */
.changes-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.changes-head .line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; }
.changes-head .counts { flex: none; }
.changes-head .compare { flex: 0 1 380px; }
.counts { display: inline-flex; gap: 10px; font-family: var(--font-data); font-size: 0.9rem; }
.c-added { color: var(--added); } .c-removed { color: var(--removed); } .c-modified { color: var(--modified); }
.filters { display: inline-flex; gap: 4px; flex: none; }
.filters button {
  border: 1px solid var(--axis); background: var(--surface); border-radius: 5px; padding: 1px 9px; font-family: var(--font-data);
}
.filters button[aria-pressed="false"] { opacity: 0.45; text-decoration: line-through; }
/* A file whose modified date changed but not its contents: a small dot, and quieter text, but not greyed out
   like things that only existed in between */
.node.date-only .name { color: var(--ink-2); }
.filter-text { background: var(--bg); border: 1px solid var(--axis); border-radius: 6px; padding: 3px 8px; font-size: 0.85rem; flex: 1 1 160px; min-width: 0; }
.compare { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 0.85rem; flex: 1; min-width: 0; }
.compare select { background: var(--bg); border: 1px solid var(--axis); border-radius: 6px; padding: 3px 6px; font-size: 0.85rem; flex: 1; min-width: 0; }
.tree { font-family: var(--font-data); font-size: 0.82rem; }
/* The columns on the right are a fixed width, in rem so the header's smaller font doesn't change them,
   so they line up at every depth of the tree */
.node { display: grid; grid-template-columns: 16px 14px minmax(0, 1fr) 3.3rem 3.3rem 3.3rem 4.6rem 5.2rem; gap: 6px; align-items: center;
  padding: 2px 6px; border-radius: 4px; }
.node > :nth-child(n+4) { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node.head { color: var(--muted); font-family: var(--font-ui); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.node.head:hover { background: none; }
.node.head > [aria-sort]:not(.c-added, .c-removed, .c-modified) { color: var(--ink); }
.node.head > [class^="c-"] { font-family: var(--font-data); font-size: 0.85rem; }
/* With files that only existed in between shown, there's a fourth count column for them */
/* Things that only existed between the snapshots compared: there, but greyed out, as they're gone again */
.node.transient { opacity: 0.45; }
.node:hover { background: var(--surface-2); }
.node .twisty { background: none; border: 0; padding: 0; width: 16px; color: var(--muted); }
.node .sym { font-weight: 600; text-align: center; }
.node .size { text-align: right; color: var(--ink-2); white-space: nowrap; }
.node .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; padding: 0; text-align: left; }
.node .name:hover { text-decoration: underline; color: var(--accent); }
.node.folder > .name { font-weight: 500; }
.children { margin-left: 18px; border-left: 1px solid var(--line); padding-left: 4px; }
.more { color: var(--muted); padding: 4px 6px; }

/* History */
.history { border-left: 1px solid var(--line); background: var(--surface); padding: 14px 16px 40px; min-width: 0;
  position: sticky; top: 57px; height: calc(100vh - 57px); overflow-y: auto; }
@media (max-width: 1250px) {
  .history { position: fixed; right: 0; top: 57px; width: min(460px, 100vw); z-index: 30; box-shadow: -8px 0 24px rgb(0 0 0 / 0.2); }
}
.history-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.history-head .target { font-family: var(--font-data); font-size: 0.85rem; word-break: break-all; margin-top: 4px; }
.close { background: none; border: 1px solid var(--axis); border-radius: 6px; width: 28px; height: 28px; flex: none; }

/* A file's details */
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 4px 0 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-family: var(--font-data); font-size: 0.88rem; }
.facts.wide { grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr); }
.facts-actions { display: flex; gap: 8px; margin-top: 14px; }
.btn.primary:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Snapshots panel */
.snaps { list-style: none; margin: 0 -16px; padding: 0; border-top: 1px solid var(--line); }
.snaprow { padding: 6px 16px 7px; border-bottom: 1px solid var(--line); cursor: pointer; }
.snaprow:hover { background: var(--surface-2); }
.snaprow.viewing { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
.snaprow.compared { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--ink-2); }
.snaprow.between { background: color-mix(in srgb, var(--accent-bg) 45%, transparent); }
.snaprow.partial { cursor: default; background: var(--warn-bg); }
.snaprow.after:not(.viewing):not(.compared) { opacity: 0.45; }
.snaprow .top { display: flex; align-items: baseline; gap: 6px; font-size: 0.85rem; }
.snaprow .marker { width: 10px; flex: none; color: var(--accent); font-size: 0.7rem; }
.snaprow.compared .marker { color: var(--ink-2); }
.snaprow .when { font-weight: 500; white-space: nowrap; }
.snaprow .disk { margin-left: auto; font-family: var(--font-data); font-size: 0.78rem; color: var(--ink-2); white-space: nowrap; }
/* The size, then what the snapshot added on disk */
.snaprow .disk + .disk { margin-left: 10px; }
.snaprow .what { display: flex; gap: 8px; margin: 2px 0 0 16px; font-family: var(--font-data); font-size: 0.78rem; color: var(--ink-2); }
/* Kept for how long, on the right beside how long ago */
.snaprow .keep { margin-left: auto; color: var(--muted); font-family: var(--font-ui); font-size: 0.75rem; white-space: nowrap; }
.snaprow .keep + .ago { margin-left: 0; }
.snaprow .ago { margin-left: auto; color: var(--muted); font-family: var(--font-ui); white-space: nowrap; }
.snaprow.unchanged .when { color: var(--muted); font-weight: 400; }
.snaprow.deleting { opacity: 0.5; cursor: default; }
/* Deleting a snapshot: a cross at the end of its row, there only while pointing at the row */
.snaprow .delete {
  flex: none; margin-left: auto; padding: 0 2px; border: 0; background: none; color: var(--muted);
  font-size: 0.95rem; line-height: 1; cursor: pointer; visibility: hidden;
}
.snaprow .disk ~ .delete { margin-left: 6px; }
.snaprow:hover .delete, .snaprow .delete:focus-visible { visibility: visible; }
.snaprow .delete:hover { color: var(--removed); }

/* Asking before something that can't be undone */
.confirm {
  width: min(440px, calc(100vw - 32px)); padding: 18px 20px; border: 1px solid var(--axis); border-radius: 8px;
  background: var(--surface); color: var(--ink); box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
}
.confirm::backdrop { background: rgb(0 0 0 / 45%); }
.confirm h2 { margin: 0 0 10px; font-size: 1rem; }
.confirm p { margin: 0 0 8px; font-size: 0.88rem; color: var(--ink-2); overflow-wrap: anywhere; }
.confirm p.what { color: var(--ink); }
.confirm .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.btn.danger:not(:disabled) { background: var(--removed); border-color: var(--removed); color: #fff; }
.elsewhere { margin-top: 12px; font-size: 0.8rem; color: var(--muted); }
.elsewhere button { background: none; border: 0; padding: 0; color: var(--accent); font-family: var(--font-data); font-size: inherit; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.note { color: var(--muted); font-size: 0.85rem; }

/* What's loading from kopia, at the bottom of the page */
.progress {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10;
  display: flex; align-items: center; gap: 12px; padding: 8px 14px; max-width: calc(100vw - 32px);
  background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; box-shadow: 0 4px 16px rgb(0 0 0 / 25%);
  font-size: 0.85rem; color: var(--ink-2);
}
.progress[hidden] { display: none; }
.progress .bar { width: 160px; height: 6px; border-radius: 3px; background: var(--axis); overflow: hidden; flex: none; }
/* While the page waits for the repository on first load */
.panel.loading { color: var(--ink-2); }
.panel.loading p { margin: 0 0 10px; }
.loading-bar { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
.loading-bar .bar { width: 240px; height: 6px; border-radius: 3px; background: var(--axis); overflow: hidden; }
.progress .fill, .jobs .fill, .loading-bar .fill { height: 100%; background: var(--accent); transition: width 0.2s; }

/* Space on disk over time: stacked bands, separated by a hairline of the panel's colour */
.storage-chart { position: relative; }
.storage-chart svg { display: block; width: 100%; height: auto; cursor: crosshair; }
.storage-chart .band { fill: var(--band); stroke: var(--surface); stroke-width: 1.5; }
/* Faded towards the panel's colour but still solid, so the gridlines behind don't show through */
.storage-chart .band.faded { fill: color-mix(in srgb, var(--band) 22%, var(--surface)); }
.chart-modes { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; flex: none; }
.chart-modes button { background: none; border: 0; padding: 2px 9px; font-size: 0.75rem; color: var(--ink-2); }
.chart-modes button + button { border-left: 1px solid var(--axis); }
.chart-modes button[aria-pressed="true"] { background: var(--accent-bg); color: var(--ink); }
.storage-chart .grid { stroke: var(--line); stroke-width: 1; }
.storage-chart .axis text, .storage-chart text.axis { fill: var(--muted); font-family: var(--font-data); font-size: 11px; }
.storage-chart .crosshair { stroke: var(--ink-2); stroke-width: 1; pointer-events: none; }
.storage-chart .rug { stroke: var(--muted); stroke-width: 1; }
.storage-chart .as-of-mark line { stroke: var(--warn-line); stroke-width: 1.5; }
.storage-chart .as-of-mark text { fill: var(--warn-line); font-size: 11px; }
.chart-tip {
  position: absolute; top: 8px; z-index: 2; pointer-events: none; padding: 8px 10px; min-width: 180px;
  background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; box-shadow: 0 4px 16px rgb(0 0 0 / 25%); font-size: 0.8rem;
}
.chart-tip[hidden] { display: none; }
.chart-tip .when { color: var(--ink-2); margin-bottom: 4px; }
.chart-tip .row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.chart-tip .row b { font-family: var(--font-data); font-weight: 600; min-width: 5.5em; text-align: right; }
.chart-tip .row span:last-child { color: var(--ink-2); }
.chart-tip .key { width: 12px; height: 3px; border-radius: 2px; flex: none; }
.chart-tip .total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
.chart-tip .hint { color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
.chart-tip .path { color: var(--ink-2); font-family: var(--font-data); font-size: 0.75rem; margin-top: 2px; white-space: pre-line; max-width: 340px; overflow-wrap: anywhere; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 0.8rem; }
.chart-legend button { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 2px 0; color: var(--ink); }
.chart-legend .swatch { width: 10px; height: 10px; border-radius: 2px; }
/* Hidden from the chart: greyed out, until clicked to show it again */
.chart-legend .hidden-item { color: var(--muted); }
.chart-legend .hidden-item .swatch { background: none; border: 1px solid var(--axis); }
.chart-legend .hidden-item .name { text-decoration: line-through; }

/* Backups, restores and deletions, in a panel at the bottom right: each with its progress, then how it went */
.jobs {
  position: fixed; right: 16px; bottom: 16px; z-index: 15; width: min(460px, calc(100vw - 32px)); max-height: 50vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
  font-size: 0.85rem;
}
.jobs[hidden] { display: none; }
.jobs-head { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.jobs-head h2 { margin: 0 auto 0 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); }
.jobs-head .btn { padding: 1px 8px; }
.jobs ul { list-style: none; margin: 0; padding: 0; }
.jobs li { padding: 8px 14px; border-bottom: 1px solid var(--line); }
.jobs li:last-child { border-bottom: 0; }
/* Still going: marked down the side */
.jobs li.active { box-shadow: inset 3px 0 0 var(--accent); background: var(--accent-bg); }
.jobs .what { overflow-wrap: anywhere; }
.jobs .status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 3px; color: var(--ink-2); overflow-wrap: anywhere; }
.jobs .status b { color: var(--ink); font-family: var(--font-data); font-weight: 500; }
/* Amounts in a sentence stand out by colour and weight, in the sentence's own font, so they sit in it evenly */
.jobs .status .amount { color: var(--ink); font-weight: 600; }
.jobs .bar { flex: 1 1 120px; height: 6px; border-radius: 3px; background: var(--axis); overflow: hidden; }
</style>
</head>
<body>
<header class="topbar">
  <h1>Kopia Explorer</h1>
  <span class="captured" id="captured"></span>
  <div class="as-of" id="as-of" role="group" aria-label="Show files as of a date">
    <button type="button" id="as-of-older" aria-label="Snapshot before">‹</button>
    <button type="button" id="as-of-button" class="when-button" aria-haspopup="dialog" aria-expanded="false" title="Show files as of another date">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5V8l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="muted">Files as of</span> <span id="as-of-label"></span> <span aria-hidden="true">▾</span>
    </button>
    <button type="button" id="as-of-newer" aria-label="Snapshot after">›</button>
    <div class="as-of-menu" id="as-of-menu" role="dialog" aria-label="Files as of" hidden>
      <form class="typed" id="as-of-typed">
        <input id="as-of-text" autocomplete="off" placeholder="Time ago (15m, 1h, 1d, 1w) or a date" aria-label="Time ago, or a date">
        <p class="error" id="as-of-error" hidden></p>
      </form>
      <ul id="as-of-list"></ul>
      <form class="custom" id="as-of-custom">
        <input type="datetime-local" id="as-of-input" aria-label="Date and time">
        <button type="submit">Go</button>
      </form>
    </div>
  </div>
</header>

<div class="app" id="app">
  <nav class="sidebar" aria-label="Backup locations">
    <h2>Backup locations</h2>
    <form class="search" id="search">
      <input id="search-input" placeholder="Filter, or paste a path" aria-label="Filter the backup locations, or a path to go to" autocomplete="off"
        title="Type to filter the locations, folders and files · paste a path like C:\Users\Peter\Documents and press Enter to go there">
    </form>
    <div class="sum" id="sum"></div>
    <div class="sort" id="sort" role="group" aria-label="Sort backup locations"></div>
    <div class="locations" id="locations" role="tree"></div>
  </nav>
  <main class="main" id="main"></main>
  <aside class="history" id="history" hidden></aside>
</div>
<div class="progress" id="progress" role="status" hidden></div>
<section class="jobs" id="jobs" aria-label="Backups, restores and deletions" aria-live="polite" hidden></section>

<script src="mock-data.js"></script>
<!-- A module, so it can wait for the snapshots to load before building the page, without freezing it -->
<script type="module">

/* ---------- Data access: live from kopia_explorer.py, or from mock-data.js when opened as a file ---------- */

// The server's mock-data.js is empty, so without mock data the page is live
const LIVE = !window.MOCK;
const DATA = window.MOCK || { diffs: {}, listings: {}, dates: {} };
const requested = new Set();  // Each request is only made once, so a failure isn't retried in a loop
const pending = new Set();    // Requests in flight, for saying something's loading
const failures = new Map();   // Requests that failed, with why, until retried
// How many of each kind of request have been made and finished, for the progress bar; reset once all are in
const progress = { changes: { done: 0, total: 0 }, folders: { done: 0, total: 0 } };

// Fetch something not loaded yet, and redraw once it arrives. Until then the page says it's loading.
function load(url, kind, store) {
  if (!LIVE || requested.has(url)) return;
  requested.add(url);
  pending.add(url);
  progress[kind].total++;
  showProgress();
  fetch(url)
    // The server puts the reason, such as kopia's error, in the status text
    .then(response => (response.ok ? response.json() : Promise.reject(new Error(response.statusText || `Error ${response.status}`))))
    .then(store)
    .catch(error => failures.set(url, { kind, reason: error instanceof TypeError ? 'Can\'t reach the server. Is kopia_explorer.py still running?' : error.message }))
    .finally(() => {
      pending.delete(url);
      progress[kind].done++;
      if (!pending.size) for (const counts of Object.values(progress)) counts.done = counts.total = 0;
      showProgress();
      redrawSoon();
    });
}

// Ask again for everything that failed
function retryFailed() {
  for (const url of failures.keys()) requested.delete(url);
  failures.clear();
  showProgress();
  redrawSoon();
}

// Why the last thing that failed did, for saying so where it's missing
const failureReason = () => [...failures.values()].pop()?.reason;

// At the bottom of the page: what's loading, counted in requests as each diff is one kopia command with no
// progress of its own, so it's one per snapshot; or what couldn't be loaded, with a retry
function showProgress() {
  const box = document.getElementById('progress');
  box.hidden = !pending.size && !failures.size;
  const count = (kind, done, total) => {
    const what = kind === 'changes' ? 'snapshot' : 'folder';
    return done == null ? plural(total, what) : `${done.toLocaleString('en-GB')} of ${plural(total, what)}`;
  };
  if (pending.size) {
    const { changes, folders } = progress;
    const done = changes.done + folders.done, total = changes.total + folders.total;
    const parts = [
      changes.total ? `changes for ${count('changes', changes.done, changes.total)}` : null,
      folders.total ? count('folders', folders.done, folders.total) : null,
    ].filter(Boolean);
    box.replaceChildren(
      el('span', {}, `Loading ${parts.join(' and ')}…`),
      el('span', { class: 'bar' }, el('span', { class: 'fill', style: `display:block;width:${100 * done / total}%` })));
  } else if (failures.size) {
    const failed = kind => [...failures.values()].filter(f => f.kind === kind).length;
    const parts = [
      failed('changes') ? `changes for ${count('changes', null, failed('changes'))}` : null,
      failed('folders') ? count('folders', null, failed('folders')) : null,
    ].filter(Boolean);
    box.replaceChildren(
      el('span', { class: 'c-removed' }, `Couldn't load ${parts.join(' or ')}: ${failureReason()}`),
      el('button', { class: 'btn', onclick: retryFailed }, 'Retry'));
  }
}

let redrawQueued = false;
function redrawSoon() {
  if (redrawQueued) return;
  redrawQueued = true;
  requestAnimationFrame(() => {
    redrawQueued = false;
    render();
  });
}

const api = {
  // Everything else is built from this, so the page waits for it, showing how the server's getting on, as
  // working out storage for locations with new snapshots can take a while
  async storage() {
    if (!LIVE) return DATA.storage;
    const main = document.getElementById('main');
    const show = (step, done, total) => main.replaceChildren(el('div', { class: 'panel loading', role: 'status' },
      el('p', {}, `${step}…`),
      total ? el('div', { class: 'loading-bar' },
        el('span', { class: 'bar' }, el('span', { class: 'fill', style: `display:block;width:${100 * done / total}%` })),
        `${done} of ${plural(total, 'location')}`) : null));
    show('Reading the repository');
    let waiting = true;
    (async () => {
      while (waiting) {
        await new Promise(resolve => setTimeout(resolve, 400));
        const progress = await fetch('/api/progress').then(r => r.json()).catch(() => ({}));
        if (waiting && progress.step) show(progress.step, progress.done, progress.total);
      }
    })();
    try {
      const response = await fetch('/api/storage');
      if (!response.ok) throw new Error(response.statusText || `Error ${response.status}`);
      const { repository, locations, read, working } = await response.json();
      DATA.repository = repository;
      storageRead = read;
      storageWorking = working;
      return locations;
    } catch (error) {
      main.replaceChildren(el('div', { class: 'panel empty' }, `Couldn't read the repository: ${
        error instanceof TypeError ? 'can\'t reach the server. Is kopia_explorer.py running?' : error.message}`));
      throw error;
    } finally {
      waiting = false;
    }
  },
  // A diff between consecutive snapshots. A missing one loads all of its location's missing diffs, one
  // request each so they fill in as they come, newest first as those are seen first.
  diff(fromId, toId) {
    let changes = DATA.diffs[`${fromId}..${toId}`];
    const loc = LIVE && !changes && storage.find(l => l.snapshots.some(s => s.id === fromId));
    if (loc) {
      const complete = loc.snapshots.filter(s => !s.incomplete);
      for (let i = complete.length - 1; i > 0; i--) {
        const key = `${complete[i - 1].id}..${complete[i].id}`;
        // Identical snapshots have nothing to ask kopia about
        if (complete[i - 1].root === complete[i].root) DATA.diffs[key] = [];
        if (!DATA.diffs[key]) load(`/api/diff?from=${complete[i - 1].id}&to=${complete[i].id}`, 'changes', list => { DATA.diffs[key] = list; });
      }
      changes = DATA.diffs[`${fromId}..${toId}`];
    }
    return changes;
  },
  // A folder's entries by object ID, loaded if missing unless only peeking, as search does
  listing(obj, fetchIfMissing = true) {
    const entries = DATA.listings?.[obj];
    if (!entries && fetchIfMissing) load(`/api/listing?obj=${obj}`, 'folders', result => { DATA.listings[obj] = result; });
    return entries;
  },
  // Files whose modified date changed but not their contents, between any two snapshots of a location
  dates(fromId, toId) {
    const key = `${fromId}..${toId}`;
    if (!DATA.dates) return undefined;
    if (!DATA.dates[key]) load(`/api/dates?from=${fromId}&to=${toId}`, 'changes', list => { DATA.dates[key] = list; });
    return DATA.dates[key];
  },
  // Asks the server, which picks where in a folder picker; the header shows it's this page asking
  post: (url, body) => fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Kopia-Explorer': '1' }, body: JSON.stringify(body),
  }).then(response => (response.ok ? response.json() : Promise.reject(new Error(response.statusText || `Error ${response.status}`)))),
};

/* ---------- Restores and backups ---------- */

// Restores and backups run on the server, and the panel at the bottom follows them. A restore asks where in
// a folder picker, then has kopia write it there, so it keeps its modified times; a backup takes a snapshot
// of a location now, as a scheduled one would.
let jobList = [];
let jobsShown = false;
let jobPolling = null;
let jobsUnreachable = false;  // The server stopped answering while following them
// Still going: choosing where, restoring, moving the finished restore into place, backing up, cancelling, or
// deleting a snapshot
const jobActive = j => ['picking', 'restoring', 'finishing', 'running', 'cancelling', 'deleting'].includes(j.state);
// Whether a snapshot is being deleted, so it can't be opened or restored from meanwhile; once deleted, it's
// still listed until the snapshots have been read again
const beingDeleted = snap => jobList.some(j => j.kind === 'delete' && j.snapshot === snap.id && j.state !== 'failed');
// A location's backup still going, if there is one
const backupOf = loc => jobList.find(j => j.kind === 'backup' && j.source === loc.path && jobActive(j));

// Restore a file or folder (rel inside the location, '' for all of it) as it was in a snapshot
function restoreItem(snap, rel, folder) {
  jobsShown = true;
  // One at a time while choosing where: the panel shows the one waiting instead of queueing another
  if (jobList.some(j => j.state === 'picking')) return renderJobs();
  startJob('/api/restore', { snapshot: snap.id, path: rel, folder },
    { kind: 'restore', name: rel.split('/').pop() || 'this location', snapshotTime: snap.time });
}

function backUp(loc) {
  jobsShown = true;
  startJob('/api/backup', { source: loc.path }, { kind: 'backup', name: loc.path, source: loc.path });
}

// Start a restore, backup or delete, or if the server won't, list it as failed, saying why
async function startJob(url, body, job) {
  try {
    jobList = [...jobList, await api.post(url, body)];
  } catch (error) {
    jobList = [...jobList, { ...job, id: `failed-${Date.now()}`, state: 'failed',
      error: error instanceof TypeError ? 'Can\'t reach the server' : error.message }];
  }
  jobsChanged();
  followJobs();
}

// The panel at the bottom, and the snapshots panel's backup button, which says whether one's going
function jobsChanged() {
  renderJobs();
  const button = document.getElementById('backup-now');
  const loc = button && storage.find(l => l.path === button.dataset.location);
  if (loc) button.replaceWith(backupButton(loc));
}

// Back up a location now, or while it's being backed up, cancel that
function backupButton(loc) {
  const job = backupOf(loc);
  const button = el('button', {
    id: 'backup-now', class: 'btn', style: 'font-size:0.8rem;flex:none', 'data-location': loc.path,
    disabled: !LIVE || job?.state === 'cancelling',
    title: !LIVE ? 'Backing up needs the server: run kopia_explorer.py'
      : job ? 'Stop it, keeping what it got through as an incomplete snapshot'
        : `Take a snapshot of ${loc.path} now, as its schedule would`,
    onclick: () => (job ? cancelBackup(job) : backUp(loc)),
  }, job?.state === 'cancelling' ? 'Cancelling…' : job ? 'Cancel backup' : 'Back up now');
  return button;
}

async function cancelBackup(job) {
  try {
    Object.assign(job, await api.post('/api/backup/cancel', { id: job.id }));
  } catch (error) {
    job.error = `Couldn't cancel: ${error instanceof TypeError ? 'can\'t reach the server' : error.message}`;
  }
  jobsChanged();
}

// Delete a snapshot for good, once a dialog has said exactly what goes: the whole snapshot of the
// location, whatever's being looked at inside it, and what that does and doesn't free up. It's deleted in
// the background, followed in the panel at the bottom, with its row marked until it's gone.
function confirmDelete(loc, snap, rel, isFolder) {
  const kept = KEEP_KINDS.find(([kind]) => snap.keep?.some(r => r.startsWith(`${kind}-`)));
  const cancel = el('button', { class: 'btn', onclick: () => dialog.close() }, 'Cancel');
  const remove = el('button', {
    class: 'btn danger',
    onclick: () => {
      dialog.close();
      jobsShown = true;
      startJob('/api/snapshot/delete', { id: snap.id },
        { kind: 'delete', name: loc.path, source: loc.path, snapshot: snap.id, snapshotTime: snap.time }).then(render);
    },
  }, 'Delete');
  const inside = rel && `${rel.replaceAll('/', '\\')}${isFolder ? '\\' : ''}`;
  const dialog = el('dialog', { class: 'confirm', 'aria-labelledby': 'confirm-title' },
    el('h2', { id: 'confirm-title' }, 'Delete this snapshot?'),
    el('p', { class: 'what' }, el('b', {}, loc.path), `, ${formatFull(snap.time)} (${shortId(snap.id)})`,
      snap.size != null ? `, ${formatSize(snap.size)}` : '', isCancelled(snap) ? ', cancelled before it finished' : ''),
    el('p', {}, inside ? `This deletes the whole snapshot of ${loc.path}, not just ${inside}. ` : '', 'It can\'t be undone.'),
    kept && kept[0] !== 'latest' ? el('p', {}, `It's kept ${kept[1]} by kopia's retention policy at the moment, so another snapshot may take its place.`) : null,
    el('p', {}, 'Space on disk is only freed once kopia\'s maintenance runs, and only for data no other snapshot uses.'),
    el('div', { class: 'actions' }, cancel, remove));
  // Gone once closed, however that happens
  dialog.addEventListener('close', () => dialog.remove());
  document.body.append(dialog);
  dialog.showModal();
  cancel.focus();
}

// Backups and deletes that finished after the snapshots were last read, by the server's clock, applied on
// top of them: a deleted snapshot taken out, and a new one put in from what kopia said when it made it
let storageRead = 0;
function applyJobs() {
  for (const j of jobList) {
    const loc = j.finished > storageRead && storage.find(l => l.path === j.source);
    if (!loc) continue;
    if (j.kind === 'delete' && j.state === 'done') loc.snapshots = loc.snapshots.filter(s => s.id !== j.snapshot);
    if (j.kind === 'backup' && j.info && !loc.snapshots.some(s => s.id === j.info.id)) {
      loc.snapshots = [...loc.snapshots, { ...j.info }].sort((a, b) => a.time.localeCompare(b.time));
    }
  }
}

// Storage stats come after the snapshots, as kopia takes a while over them, so a new snapshot may not have
// them yet: what it added on disk stays unknown, and the total on disk is taken as unchanged since the one
// before, until they come. With none known for a location, such as the first time, its total is unknown too.
let storageWorking = false;
function fillTotals() {
  for (const loc of storage) {
    let total = null;
    for (const snap of loc.snapshots) {
      if (snap.onDisk == null) snap.total = total;
      else total = snap.total;
    }
  }
}

// While the server works out storage stats, the header says how it's getting on; once it's done, the
// snapshots are read again for them
let storagePolling = null;
function followStorage() {
  if (storagePolling || !storageWorking) return renderCaptured();
  renderCaptured();
  storagePolling = setInterval(async () => {
    const progress = await fetch('/api/progress').then(r => r.json()).catch(() => null);
    if (!progress) return;
    if (progress.step) return renderCaptured(progress);
    clearInterval(storagePolling);
    storagePolling = null;
    refreshStorage();
  }, 1500);
}

function renderCaptured(progress = {}) {
  const captured = document.getElementById('captured');
  if (!LIVE) {
    captured.textContent = `Mockup · data captured ${formatFull(DATA.captured)}`;
    return;
  }
  captured.replaceChildren(`${DATA.repository.description || DATA.repository.path} · live from kopia, read ${formatFull(new Date(storageRead * 1000))}`);
  if (storageWorking) {
    captured.append(el('span', { title: 'Space on disk for new snapshots, which kopia takes a while over' },
      ` · working out storage${progress.total ? ` for ${progress.done} of ${plural(progress.total, 'location')}` : ''}…`));
  }
}

// After the snapshots have changed: everything redrawn, with viewing or comparing with a snapshot that's
// been deleted going back to the default, and anything that failed to load for a deleted one forgotten
function snapshotsChanged() {
  fillTotals();
  treePositions = treeScale();
  const known = new Set(storage.flatMap(l => l.snapshots.map(s => s.id)));
  for (const url of [...failures.keys()]) {
    if ([...url.matchAll(/[?&](?:from|to)=([0-9a-f]+)/g)].some(m => !known.has(m[1]))) failures.delete(url);
  }
  showProgress();
  const gone = id => id && !known.has(id);
  if (gone(state.snapshot) || gone(state.compare)) {
    return navigate({ snapshot: gone(state.snapshot) ? null : state.snapshot, compare: gone(state.compare) ? null : state.compare }, true);
  }
  render();
}

// Read the snapshots again, quietly, as a backup has made one or one's been deleted. Each location's list is
// replaced in place, with the snapshots already known kept as the same objects, so everything holding on to
// them still finds them. A location that's new shows when the page is reloaded. One read at a time: asked for
// again meanwhile, it reads once more after, to catch what changed since it started.
let refreshing = null;
let refreshAgain = false;
function refreshStorage() {
  if (refreshing) {
    refreshAgain = true;
    return refreshing;
  }
  refreshing = (async () => {
    do {
      refreshAgain = false;
      try {
        const response = await fetch('/api/storage');
        if (!response.ok) return;
        const { locations, read, working } = await response.json();
        for (const fresh of locations) {
          const loc = storage.find(l => l.path === fresh.path);
          if (!loc) continue;
          const known = new Map(loc.snapshots.map(s => [s.id, s]));
          loc.snapshots = fresh.snapshots.map(s => Object.assign(known.get(s.id) || {}, s));
        }
        storageRead = read;
        storageWorking = working;
        applyJobs();
        snapshotsChanged();
        followStorage();
      } catch {
        // It's read again after the next backup or delete, or when the page is reloaded
        return;
      }
    } while (refreshAgain);
  })().finally(() => { refreshing = null; });
  return refreshing;
}

// Open something in Windows Explorer, via the server; if that fails, the button says why
function showInExplorer(path, button) {
  api.post('/api/reveal', { path }).catch(error => {

// While a restore or backup is going, ask the server how it's getting on every second
function followJobs() {
  if (jobPolling) return;
  jobPolling = setInterval(async () => {
    let list;
    try {
      list = await fetch('/api/jobs').then(r => r.json());
      jobsUnreachable = false;
    } catch {
      // Keep trying, as it may be restarting, but say so
      if (!jobsUnreachable) {
        jobsUnreachable = true;
        renderJobs();
      }
      return;
    }
    // A backup that's just ended has made a snapshot, even if cancelled, and a delete has removed one
    const ended = list.some(j => j.kind !== 'restore' && !jobActive(j) && jobList.some(o => o.id === j.id && jobActive(o)));
    jobList = list;
    jobsChanged();
    // Shown straight away, then read again for what isn't known yet
    if (ended) {
      applyJobs();
      snapshotsChanged();
      refreshStorage();
    }
    if (!jobList.some(jobActive)) {
      clearInterval(jobPolling);
      jobPolling = null;
    }
  }, 1000);
}

// A backup in the panel at the bottom: how far it's got, which kopia can only say once it's worked out

        el('span', { class: 'amount' }, formatSize(j.uploaded)), ' uploaded', errors),

/* ---------- Formatting ---------- */

const fullFormat = new Intl.DateTimeFormat('en-GB', { dateStyle: 'medium', timeStyle: 'short' });

const relativeFormat = new Intl.RelativeTimeFormat('en-GB', { numeric: 'auto' });

  for (const [unit, size] of units) {

/* ---------- Colour scales (ported from snapshot_storage.py / snapshot_history.py) ---------- */

const GRADIENT = [[90, 200, 120], [230, 210, 90], [240, 90, 80]];
const GAP_LIMIT = 0.5, GAP_SCALE = 0.1, MIN_RANGE = 3;
const NO_CHANGE = [240, 240, 240], GROWTH = [240, 90, 80], SHRINK = [90, 200, 120];

// Log scale from the smallest to the largest amount, at least MIN_RANGE powers of 10 deep,
// with big jumps between neighbours shrunk so one huge amount doesn't squash the rest.
function gradientPositions(amounts) {
  const result = new Map();
  if (!amounts.length) return result;
  const unique = [...new Set(amounts.map(a => Math.log10(a)))];
  const floor = Math.min(Math.min(...unique), Math.max(...unique) - MIN_RANGE);
  const logs = [...new Set([...unique, floor])].sort((a, b) => a - b);
  const scaled = new Map([[logs[0], 0]]);
  for (let i = 1; i < logs.length; i++) {
    let gap = logs[i] - logs[i - 1];
    if (gap > GAP_LIMIT) gap = GAP_LIMIT + (gap - GAP_LIMIT) * GAP_SCALE;
    scaled.set(logs[i], scaled.get(logs[i - 1]) + gap);
  }
  const end = scaled.get(logs[logs.length - 1]);
  for (const a of amounts) result.set(a, end ? scaled.get(Math.log10(a)) / end : 0.5);
  return result;
}
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
function gradientRgb(position) {
  const p = Math.min(Math.max(position, 0), 1) * (GRADIENT.length - 1);
  const i = Math.min(Math.floor(p), GRADIENT.length - 2);
  return mix(GRADIENT[i], GRADIENT[i + 1], p - i);
}
const changeRgb = (amount, positions) => mix(NO_CHANGE, amount > 0 ? GROWTH : SHRINK, positions.get(Math.abs(amount)));
const isDark = () => document.documentElement.dataset.theme === 'dark' ||
  (document.documentElement.dataset.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
// Bright colours are made for dark backgrounds, so darken them for text on a light one
const textColour = rgb => `rgb(${(isDark() ? rgb : rgb.map(v => Math.round(v * 0.55))).join(' ')})`;
const fillColour = rgb => `rgb(${rgb.join(' ')})`;

/* ---------- State and routing (kept in the URL, so back and bookmarks work) ---------- */

// The middle shows either a backup location or a plain folder above locations, never both.
// scope is a folder inside the location (with / separators), which narrows everything shown to it,
// and file is a file in that folder whose own page is shown instead.
// The right-hand panel lists the location's snapshots for the folder or file being looked at, or for
// history, a path picked with a single click, until moving somewhere else.
const state = {
  location: null, folder: null, scope: '', file: null, snapshot: null, compare: null, history: null,
  // * is for things that only existed between two snapshots compared, which are always shown, greyed out;
  // d is for files whose modified date changed but not their contents
  filters: { '+': true, '-': true, '~': true, '*': true, d: true }, filterText: '',
};

function readHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  state.location = params.get('loc');
  state.folder = state.location ? null : params.get('dir');
  state.scope = state.location ? params.get('in') || '' : '';
  state.file = state.location ? params.get('file') : null;
  state.snapshot = params.get('snap');
  state.compare = params.get('cmp');
  state.history = params.get('hist');
  state.asOf = params.get('at');
}
function writeHash(replace = false) {
  const params = new URLSearchParams();
  if (state.location) params.set('loc', state.location);
  if (state.scope) params.set('in', state.scope);
  if (state.file) params.set('file', state.file);
  if (state.folder) params.set('dir', state.folder);
  if (state.snapshot) params.set('snap', state.snapshot);
  if (state.compare) params.set('cmp', state.compare);
  if (state.history) params.set('hist', state.history);
  if (state.asOf) params.set('at', state.asOf);

  }

  if ('asOf' in changes) {
    changes.snapshot = null;
    changes.compare = null;
  }
  // A file's own page is left when moving to another folder, but not when picking another snapshot of it
  if (!('file' in changes) && ['location', 'folder', 'scope'].some(key => key in changes)) changes.file = null;
  if (changes.location) changes.folder = null;

  if (changes.location && !('scope' in changes)) changes.scope = '';

    changes.snapshot = null;

window.addEventListener('popstate', () => {

/* ---------- Locations ---------- */

const storage = await api.storage();
fillTotals();

// Restores and backups carry on if the page is reloaded, so pick up any still going
if (LIVE) {
  fetch('/api/jobs').then(r => r.json()).then(list => {
    jobList = list;
    if (list.some(jobActive)) {
      jobsShown = true;
      jobsChanged();
      followJobs();
    }

}
const latest = loc => [...loc.snapshots].reverse().find(s => !s.incomplete) || loc.snapshots[loc.snapshots.length - 1];

// Build a folder tree from the backup locations: the PC at the top, named after the computer the
// snapshots were taken on, then its drives, with locations nested inside each other
const treeNodes = new Map();  // Every folder in the tree by lower-cased path, for looking up a folder page
function buildLocationTree() {
  const hosts = [...new Set(storage.map(loc => loc.host).filter(Boolean))];
  const name = hosts.length === 1 ? hosts[0] : DATA.repository?.description || 'This PC';
  const root = { name, path: name, children: new Map(), root: true };
  treeNodes.set(name.toLowerCase(), root);
  for (const loc of storage) {
    const parts = loc.path.split('\\').filter(Boolean);
    let node = root;
    parts.forEach((part, i) => {
      if (!node.children.has(part)) {
        const path = i === 0 ? `${part}\\` : parts.slice(0, i + 1).join('\\');
        const child = { name: i === 0 ? `${part}\\` : part, path, children: new Map(), drive: i === 0 };
        node.children.set(part, child);
        treeNodes.set(path.toLowerCase(), child);
      }
      node = node.children.get(part);
    });
    node.location = loc;
  }
  return root;
}

function locationsBelow(node) {
  const found = node.location ? [node.location] : [];
  for (const child of node.children.values()) found.push(...locationsBelow(child));
  return found;
}

// On-disk total of a folder: its own if it's a location, otherwise the locations below it,
// skipping locations nested inside another so they aren't counted twice
function treeTotal(node) {
  if (node.location) return locationTotal(node.location);
  let total = 0;
  for (const child of node.children.values()) {
    const inside = treeTotal(child);

    if (inside == null) return null;
    total += inside;
  }

}
// A size on disk, or … while it's being worked out
const diskText = size => (size == null ? '…' : formatSize(size));

function compactFolder(node) {
  const names = [node.name];

    names.push(node.name);

}

const locationTree = buildLocationTree();

  if (!path) return;
  collapsedFolders.delete(locationTree.path);
  const parts = path.replace(/\\$/, '').split('\\');
  for (let i = 1; i < parts.length; i++) {
    const sub = i === 1 ? `${parts[0]}\\` : parts.slice(0, i).join('\\');
    collapsedFolders.delete(sub);
    openFolders.add(sub.toLowerCase());
  }
}

// Colour every folder's total on one scale, so colours don't shift as folders are expanded. It's worked
// out again when the snapshots are read again, as the totals change.
function treeScale() {
  const totals = [];
  (function collectTotals(node) {
    for (const child of node.children.values()) {
      totals.push(treeTotal(child));
      collectTotals(child);
    }
  })(locationTree);
  return gradientPositions(totals.filter(Boolean));
}
let treePositions = treeScale();

// How the sidebar is sorted, remembered in this browser. Clicking the current sort again reverses it.
const SORTS = { tree: 'Folders', size: 'Size', name: 'Name' };
// Size starts largest first, the others A–Z
const DESCENDING_BY_DEFAULT = { tree: false, size: true, name: false };
let sidebarSort = 'tree';
let sidebarReversed = false;
try {
  if (SORTS[localStorage.getItem('sidebarSort')]) sidebarSort = localStorage.getItem('sidebarSort');
  sidebarReversed = localStorage.getItem('sidebarReversed') === '1';
} catch {}

function renderSort() {
  document.getElementById('sort').replaceChildren(...Object.entries(SORTS).map(([key, label]) => {
    const active = key === sidebarSort;
    const descending = DESCENDING_BY_DEFAULT[key] !== (active && sidebarReversed);
    return el('button', {
      'aria-pressed': String(active),
      title: active ? 'Click again to reverse' : `Sort by ${label.toLowerCase()}`,
      onclick: () => {
        if (active) sidebarReversed = !sidebarReversed;
        else { sidebarSort = key; sidebarReversed = false; }
        try {
          localStorage.setItem('sidebarSort', sidebarSort);
          localStorage.setItem('sidebarReversed', sidebarReversed ? '1' : '0');
        } catch {}
        renderSort();
        renderLocations();
      },
    }, active ? `${label} ${descending ? '▼' : '▲'}` : label);
  }));
}

/* Sidebar items. Above the locations, folders come from the tree of locations. Inside a location,
   its folders come from the snapshot being looked at (or its latest), with locations nested inside it
   slotted in among them. Each item knows the location it's in (owner) and its path there (rel). */

const joinRel = (rel, name) => (rel ? `${rel}/${name}` : name);

// The snapshot a location's folders are read from: the one selected if it's open, otherwise its latest
function sidebarSnapshot(loc) {
  const snap = loc.path === state.location ? selectedSnapshot(loc) : asOfSnapshot(loc);
  return snap.incomplete ? [...loc.snapshots].reverse().find(s => !s.incomplete) : snap;
}

const treeItem = node => node.location
  ? { name: node.name, path: node.path, tree: node, owner: node.location, rel: '' }
  : { name: node.name, path: node.path, tree: node, owner: null, rel: '' };

// The folders shown inside an item. Live listings only load once it's opened, so until then it's marked
// as maybe having some, to show it can be expanded.
function sidebarChildren(item) {
  const children = new Map();
  let unknown = false;
  if (item.owner) {
    const snap = sidebarSnapshot(item.owner);
    const entries = snap && snapshotListing(snap, item.rel, isOpen(item));
    unknown = LIVE && !!snap && entries === undefined;
    for (const entry of entries || []) {
      if (entry.t !== 'd') continue;
      children.set(entry.n.toLowerCase(), {
        name: entry.n, path: `${item.path.replace(/\\$/, '')}\\${entry.n}`, tree: null,
        owner: item.owner, rel: joinRel(item.rel, entry.n), size: entry.s,
      });
    }
  }
  for (const child of item.tree?.children.values() || []) {
    const key = child.name.toLowerCase();
    // A nested location is its own owner; other folders on the way to one belong to the location they're in
    children.set(key, child.location ? treeItem(child) : {
      name: child.name, path: child.path, tree: child, owner: item.owner,
      rel: item.owner ? joinRel(item.rel, child.name) : '', size: children.get(key)?.size,
    });
  }
  return Object.assign([...children.values()], { unknown });
}

// Whether an item is open: folders above the locations unless closed, locations and folders inside them if opened
const isOpen = item => item.owner ? openFolders.has(item.path.toLowerCase()) : !collapsedFolders.has(item.path);
function toggleOpen(item) {
  if (item.owner) {
    const key = item.path.toLowerCase();
    openFolders.has(key) ? openFolders.delete(key) : openFolders.add(key);
  } else {
    collapsedFolders.has(item.path) ? collapsedFolders.delete(item.path) : collapsedFolders.add(item.path);
  }
  renderLocations();
}

// Close an item and everything inside it: locations and their folders by forgetting they were opened,
// and the folders above locations, which start open, by marking them closed
function collapseAll(item) {
  const path = item.path.replace(/\\$/, '').toLowerCase();
  // Everything is inside the PC
  const inside = key => item.tree?.root || key.replace(/\\$/, '') === path || key.startsWith(`${path}\\`);
  for (const key of [...openFolders]) if (inside(key)) openFolders.delete(key);
  for (const node of treeNodes.values()) {
    if (!node.location && node.children.size && inside(node.path.toLowerCase())) collapsedFolders.add(node.path);
  }
  renderLocations();
}

// Highlighted when it's what's shown in the middle
function isCurrent(item) {
  if (item.tree?.location) return state.location === item.tree.location.path && !state.scope;
  if (item.owner) return state.location === item.owner.path && state.scope === item.rel;
  return state.folder === item.path;
}

// Where clicking an item goes; within the location already open, the selected snapshot is kept
function itemTarget(item) {
  if (item.tree?.location) {
    const path = item.tree.location.path;
    return state.location === path ? { location: path } : { location: path, snapshot: null };
  }
  if (item.owner) return state.location === item.owner.path ? { scope: item.rel } : { location: item.owner.path, snapshot: null, scope: item.rel };
  return { folder: item.path };
}

function renderLocations() {
  if (sidebarFilter) return renderMatches();
  document.getElementById('sum').textContent = `${storage.length} locations · ${diskText(treeTotal(locationTree))} on disk`;
  const direction = sidebarReversed ? -1 : 1;
  const rows = [];
  // In the flat lists the direction is for size or path, so what's inside a location is always A–Z
  const nameDirection = sidebarSort === 'tree' ? direction : 1;
  const sorted = items => items.sort((a, b) => nameDirection * a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }));

  // A row for an item, with label parts given: the path leading to it dimmed, then its own name
  const row = (item, depth, prefix, label, children) => {
    const loc = item.tree?.location;
    const expandable = children.length > 0 || children.unknown;
    const open = expandable && isOpen(item);
    // Sizes on disk for locations and the folders above them; plain sizes, greyed, for folders inside
    const onDisk = item.tree && (loc || !item.owner);
    const total = onDisk ? treeTotal(item.tree) : null;
    rows.push(el('div', {
      class: `fsrow${loc ? '' : ' group'}`, 'aria-current': isCurrent(item) ? 'true' : 'false',
      style: `padding-left:${6 + depth * 12}px`,
    },
      expandable
        ? el('button', { class: 'twisty', 'aria-expanded': String(open), 'aria-label': `${open ? 'Collapse' : 'Expand'} ${label}`, onclick: () => toggleOpen(item) }, open ? '▾' : '▸')
        : el('span'),
      // A click opens it in the middle; a double click expands or collapses it. The first click redraws
      // the sidebar, so the second is recognised by its click count rather than a dblclick event.
      el('button', {
        class: 'label', title: `${loc ? `${loc.path} (backup location)` : item.tree?.root ? repositoryTitle() : item.path}${expandable ? ' · double-click to expand or collapse' : ''}`,
        onclick: event => {
          if (event.detail < 2) navigate(itemTarget(item));
          // Collapsing this way closes everything inside it too, so it opens again one level at a time
          else if (open) collapseAll(item);
          else if (expandable) toggleOpen(item);
        },
      },
        loc ? el('span', { class: 'dot', 'aria-hidden': 'true' }) : null,
        prefix ? el('span', { class: 'prefix' }, prefix) : null,
        // Folders end in a backslash, like drives and the contents tables; the PC isn't a folder
        el('span', { class: 'text' }, item.tree?.root || label.endsWith('\\') ? label : `${label}\\`),
        loc && backingUpNow(loc) ? el('span', { class: 'badge', title: 'A snapshot is in progress' }, 'Live') : null),
      // The PC's total is everything, so it's left off the colour scale
      onDisk && total == null ? el('span', { class: 'total muted', title: 'Working out space on disk…' }, '…')
        : total != null
          ? el('span', { class: 'total', style: total && !item.tree.root ? `color:${textColour(gradientRgb(treePositions.get(total)))}` : null }, formatSize(total))
          : el('span', { class: 'total muted' }, item.size != null ? formatSize(item.size) : '')));
    if (open) for (const child of sorted(children)) walk(child, depth + 1);
  };

  const walk = (item, depth) => {
    // Folders above the locations that only lead to one folder are merged into one row
    if (!item.owner && item.tree && !item.tree.drive && !item.tree.root && !item.tree.location) {
      const { node, prefix, label } = compactFolder(item.tree);
      const merged = treeItem(node);
      return row(merged, depth, prefix, label, sidebarChildren(merged));
    }
    row(item, depth, '', item.name, sidebarChildren(item));
  };

  if (sidebarSort === 'tree') {
    walk(treeItem(locationTree), 0);
  } else {
    // Every location as a top-level row with its full path, each expandable like in the tree
    const locations = [...storage].sort(sidebarSort === 'size'
      ? (a, b) => direction * (locationTotal(b) - locationTotal(a))
      : (a, b) => direction * a.path.localeCompare(b.path, 'en', { sensitivity: 'base' }));
    for (const loc of locations) {
      const item = treeItem(treeNodes.get(loc.path.toLowerCase()));
      const cut = loc.path.replace(/\\$/, '').lastIndexOf('\\') + 1;
      row(item, 0, cut ? loc.path.slice(0, cut) : '', loc.path.slice(cut) || loc.path, sidebarChildren(item));
    }
  }
  document.getElementById('locations').replaceChildren(...rows);
}

/* ---------- Main: selected location ---------- */

// What's directly inside a folder: merged folder chains and backup locations, like the sidebar
// The folder above, skipping folders that only lead to one other folder, or null at a drive
function parentNode(node) {
  let path = node.path.replace(/\\$/, '');
  while (path.includes('\\')) {
    path = path.slice(0, path.lastIndexOf('\\'));
    const parent = treeNodes.get((path.includes('\\') ? path : `${path}\\`).toLowerCase());
    if (parent && (parent.location || parent.drive || parent.children.size > 1)) return parent;
  }
  // Drives are in the PC
  return node.root ? null : locationTree;
}

// Size, files and modified time of a folder from each location's snapshot as of the date (the latest
// by default), counting a location nested inside another only once, as part of the outer one
function latestSummary(node) {
  if (node.location) {
    const snap = asOfSnapshot(node.location);
    return snap && !snap.incomplete ? { size: snap.size, files: snap.files, modified: snap.mtime } : { size: 0, files: 0, modified: null };
  }
  const summary = { size: 0, files: 0, modified: null };
  for (const child of node.children.values()) {
    const inner = latestSummary(child);
    summary.size += inner.size;
    summary.files += inner.files;
    if (inner.modified && (!summary.modified || inner.modified > summary.modified)) summary.modified = inner.modified;
  }
  return summary;
}

// A folder page's contents: the folders and backup locations directly inside it, from their latest snapshots
function renderContents(node) {
  const items = [...node.children.values()].map(child => {
    const { node: inner, prefix, label } = compactFolder(child);
    const loc = inner.location;
    return {
      // Folders get a backslash added, which drives have already
      key: inner.path, prefix, label: label.replace(/\\$/, ''), folder: true, location: loc,
      live: locationsBelow(inner).some(backingUpNow),
      ...latestSummary(inner),
      // A location shows its history on a single click; plain folders aren't backed up themselves
      pick: loc ? () => { pickedIsFolder = true; navigate({ history: loc.path }); } : null,
      open: () => navigate(loc ? { location: loc.path, snapshot: null } : { folder: inner.path }),
    };
  });
  const parent = parentNode(node);
  const up = parent ? {
    label: parent.path,
    go: () => navigate(parent.location ? { location: parent.location.path, snapshot: null } : { folder: parent.path }),
  } : null;
  return contentsTable(state.asOf
    ? `From each backup location's snapshot as of ${formatFull(state.asOf)}`
    : 'From the latest snapshot of each backup location', up, items, () => renderContents(node));
}

// Breadcrumbs for a path, each folder above it clickable
function pathCrumbs(path) {
  if (path === locationTree.path) return el('div', { class: 'crumbs', style: 'font-size:1.15rem;margin:0;gap:0' }, el('span', { class: 'current' }, path));
  const parts = path.split('\\').filter(Boolean);
  // No gap between parts, so the path reads as one, like B:\Projects\Photos
  return el('div', { class: 'crumbs', style: 'font-size:1.15rem;margin:0;gap:0' }, parts.map((part, i) => {
    const sub = i === 0 ? `${part}\\` : parts.slice(0, i + 1).join('\\');
    const node = treeNodes.get(sub.toLowerCase());
    const label = i === 0 ? `${part}\\` : part;
    const last = i === parts.length - 1;
    return [
      i > 1 ? el('span', {}, '\\') : null,
      last || !node ? el('span', { class: 'current' }, label)
        : el('button', { onclick: () => navigate(node.location ? { location: node.location.path, snapshot: null } : { folder: node.path }) }, label),
    ];
  }));
}

// Breadcrumbs for a location, continuing into the folder in scope
function locationCrumbs(loc) {
  const crumbs = pathCrumbs(loc.path);
  if (!state.scope) return crumbs;
  // The location's own name becomes a link back to the whole location
  const last = crumbs.lastElementChild;
  last.replaceWith(el('button', { onclick: () => navigate({ scope: '' }) }, last.textContent));
  const parts = state.scope.split('/');
  parts.forEach((part, i) => {
    crumbs.append(el('span', {}, '\\'), i === parts.length - 1
      ? el('span', { class: 'current' }, part)
      : el('button', { onclick: () => navigate({ scope: parts.slice(0, i + 1).join('/') }) }, part));
  });
  return crumbs;
}

function renderFolder(main) {
  const node = treeNodes.get(state.folder.toLowerCase());
  if (!node) {
    main.replaceChildren(el('div', { class: 'panel empty' }, `${state.folder} isn't a folder with backup locations in it.`));
    return;
  }
  const below = locationsBelow(node);
  main.replaceChildren(
    el('section', { class: 'loc-head' },
      pathCrumbs(node.path),
      el('div', { class: 'meta' },
        el('span', {}, el('b', {}, diskText(treeTotal(node))), ' on disk'),
        el('span', {}, plural(below.length, 'backup location')))),
    renderContents(node),
    renderStorageChart(node));
}

// How the space the locations inside a folder take on disk grew over time, stacked: each location's running
// total as of its latest snapshot at each moment. kopia counts storage per location, so data shared between
// locations is counted in each.
function renderStorageChart(node) {
  // Like the totals elsewhere, a location inside another counts as part of that one
  const below = locationsBelow(node);
  const within = (inner, outer) => inner.path.toLowerCase().startsWith(`${outer.path.replace(/\\$/, '').toLowerCase()}\\`);
  const locations = below.filter(l => l.snapshots.some(s => !s.incomplete) && !below.some(o => o !== l && within(l, o)));
  if (locations.length < 2) return null;

  // Every moment a snapshot was taken, then now; each location's total is its latest snapshot's by then
  const now = Date.now();
  const times = [...new Set(locations.flatMap(l => l.snapshots.filter(s => !s.incomplete).map(s => Date.parse(s.time)))), now]
    .sort((a, b) => a - b);
  const items = locations.map(loc => {
    const snaps = loc.snapshots.filter(s => !s.incomplete);
    let at = -1;
    const values = times.map(t => {
      while (at + 1 < snaps.length && Date.parse(snaps[at + 1].time) <= t) at++;
      return at < 0 ? 0 : snaps[at].total;
    });
    return {
      name: loc.path.slice(loc.path.replace(/\\$/, '').lastIndexOf('\\') + 1) || loc.path, title: loc.path, values,
      lastAt: t => Math.max(0, ...snaps.filter(s => Date.parse(s.time) <= t).map(s => Date.parse(s.time))),
      // Like its row in Contents
      pick: () => { pickedRow = loc.path; pickedIsFolder = true; navigate({ history: loc.path }); },
      open: () => navigate({ location: loc.path, snapshot: null }),
    };
  }).sort((a, b) => b.values[b.values.length - 1] - a.values[a.values.length - 1]);

  return stackedChart({
    key: `folder:${node.path}`, heading: 'Space on disk over time', what: ['location', 'locations'], items, times, now,
    note: 'Each location\'s data on disk, as it grew with each snapshot it still has, with locations inside another counted as part of it. kopia counts each location\'s storage separately, so data shared between them is counted more than once and the total can be a little more than the repository uses.',
  });
}

// How big each folder and file in the folder in scope was at each of a location's snapshots, stacked, from
// the folder's listing at each one. kopia only counts space on disk for whole locations, so this is size.
// The biggest at their peak get their own bands, so something big that's since gone still stands out.
function renderSizeChart(loc) {
  const complete = loc.snapshots.filter(s => !s.incomplete);
  if (complete.length < 2) return null;
  const listings = complete.map(snap => snapshotListing(snap, state.scope));
  const panel = (...body) => el('section', { class: 'panel' }, el('h2', {}, 'Size over time'), ...body);
  if (listings.includes(undefined)) return panel(el('p', { class: 'note' }, notLoaded('folder listings')));

  // Each thing in it at each snapshot, holding until the next, then the same now
  const now = Date.now();
  const times = [...complete.map(s => Date.parse(s.time)), now];
  const found = new Map();
  listings.forEach((entries, j) => {
    for (const entry of entries || []) {
      const key = `${entry.t}:${entry.n}`;
      if (!found.has(key)) found.set(key, { entry, values: times.map(() => 0) });
      found.get(key).values[j] = entry.s || 0;
    }
  });
  if (!found.size) return null;
  const lastAt = t => Math.max(0, ...times.slice(0, -1).filter(time => time <= t));
  const items = [...found.values()].map(({ entry, values }) => {
    values[values.length - 1] = values[values.length - 2];
    const isFolder = entry.t === 'd';
    const full = pathInScope(loc, entry.n);
    const nested = isFolder ? treeNodes.get(full.toLowerCase())?.location : null;
    return {
      name: entry.n + (isFolder ? '\\' : ''), title: full, values, lastAt, peak: Math.max(...values),
      // Like its row in Contents: its snapshots, then going into it, a location inside, or a file's own page
      pick: () => { pickedRow = full; openHistory(entry.n, isFolder); },
      open: () => navigate(nested ? { location: nested.path, snapshot: null }
        : isFolder ? { scope: joinRel(state.scope, entry.n) } : { file: entry.n }),
    };
  }).sort((a, b) => b.peak - a.peak);

  return stackedChart({
    key: `size:${loc.path}:${state.scope}`, heading: 'Size over time', what: ['item', 'items'], items, times, now,
    note: 'How big each folder and file in here was at each snapshot. kopia only counts space on disk for a whole location, so this is their size rather than what they take up in the repository.',
  });
}

// Clicking a band hides it, and clicking Others hides all the ones shown, to see what's left in more detail.
// These are the ones hidden, by title, for the chart they're hidden from, so they stay hidden while moving
// around the page.
let chartHidden = { key: null, titles: new Set() };

// Charts stack their bands on top of each other, or overlay them, each from zero, to compare them; remembered
let chartOverlaid = false;
try { chartOverlaid = localStorage.getItem('chartMode') === 'overlaid'; } catch {}

// A stacked chart of things over time, biggest at the bottom: items are { name, title (unique), values (one per
// time), lastAt(t) (the snapshot a value at t is from), pick(), open() (what single and double clicks on its
// band do, like its row in Contents) }, biggest first. The first seven shown get
// their own colours; any more are added together as Others.
function stackedChart(options) {
  const { key, heading, what, items, times, now, note } = options;
  const hidden = chartHidden.key === key ? chartHidden.titles : new Set();
  const shown = items.filter(item => !hidden.has(item.title));
  const setHidden = titles => {
    chartHidden = { key, titles };
    panel.replaceWith(stackedChart(options));
  };
  const named = shown.length > 8 ? shown.slice(0, 7) : shown;
  const others = shown.slice(named.length);
  // The last one shown stays, so there's always something to see
  const hideItem = item => { if (shown.length > 1) setHidden(new Set([...hidden, item.title])); };
  const openOthers = () => setHidden(new Set([...hidden, ...named.map(item => item.title)]));
  const series = [
    ...named.map((item, i) => ({ ...item, colour: `var(--series-${i + 1})` })),
    ...(others.length ? [{
      name: `${others.length} others`, title: `${others.length} smaller ${what[1]} added together`, colour: 'var(--series-other)', others: true,
      values: times.map((_, j) => others.reduce((sum, item) => sum + item.values[j], 0)),
      lastAt: t => Math.max(...others.map(item => item.lastAt(t))),
    }] : []),
  ];
  // Each band's top at each moment, stacked in order from the bottom; overlaid, the scale goes up to the biggest one
  const tops = [];
  series.forEach((s, i) => tops.push(s.values.map((v, j) => v + (i ? tops[i - 1][j] : 0))));
  const max = chartOverlaid ? Math.max(...series.flatMap(s => s.values)) : Math.max(...tops[tops.length - 1]);

  // Drawn at the width it's shown at, once it's on the page, and again if that changes
  const chart = el('div', { class: 'storage-chart' });
  let highlight = () => {};
  let drawnWidth = 0;
  const drawIfResized = () => {
    if (!chart.isConnected || !chart.clientWidth || Math.abs(chart.clientWidth - drawnWidth) <= 1) return;
    drawnWidth = chart.clientWidth;
    highlight = drawStackedChart(chart, drawnWidth, { heading, series, times, tops, max, now, openOthers, overlaid: chartOverlaid });
  };
  new ResizeObserver(drawIfResized).observe(chart);
  // Straight away once it's been put on the page, which happens just after this returns
  queueMicrotask(drawIfResized);
